<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projection vs Actual · Prontox</title>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ============================================================
           PRONTOX COLOR PALETTE & FONTS
           ============================================================ */

        /* --- COLORS (Light Mode - default) --- */
        :root {
            --bg: #F0F4F8;
            --surface: #FFFFFF;
            --surface-2: #F8FAFC;
            --surface-3: #F1F5F9;
            --text-primary: #1A2332;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --accent: #00AFEF;
            --accent-hover: #0099D3;
            --accent-dark: #0088CC;
            --accent-light: #E6F6FE;
            --accent-mid: #B3E5FC;

            /* Status Colors */
            --status-submitted: #8b5cf6;
            --status-submitted-bg: #ede9fe;
            --status-review: #f59e0b;
            --status-review-bg: #fef3c7;
            --status-approved: #3b82f6;
            --status-approved-bg: #dbeafe;
            --status-implemented: #10b981;
            --status-implemented-bg: #d1fae5;

            /* Shadows */
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.08);

            /* Border Radius */
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 8px;

            /* Transitions */
            --transition: 0.3s ease;
        }

        /* --- DARK MODE OVERRIDES --- */
        [data-theme="dark"] {
            --bg: #0E0F11;
            --surface: #1A1E21;
            --surface-2: #24292E;
            --surface-3: #2D3338;
            --text-primary: #E7E9EB;
            --text-secondary: #AAB0B6;
            --text-muted: #888E99;
            --border: #353E46;
            --accent: #60A5FA;
            --accent-hover: #3B82F6;
            --accent-dark: #2563EB;
            --accent-light: #1a3a5a;
            --accent-mid: #2a4a6a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.5);
            --status-submitted: #a78bfa;
            --status-submitted-bg: #2d1b4e;
            --status-review: #fbbf24;
            --status-review-bg: #4d3a0a;
            --status-approved: #60a5fa;
            --status-approved-bg: #1a2a4a;
            --status-implemented: #34d399;
            --status-implemented-bg: #0a3a2a;
        }

        /* --- RESET & BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            transition: background var(--transition), color var(--transition);
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
        }

        select {
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        /* --- MAIN WRAPPER --- */
        .pa-wrapper {
            width: 100%;
            max-width: 1280px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }

        /* --- HEADER --- */
        .pa-header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            transition: border-color var(--transition);
        }
        .pa-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .pa-header h1 i {
            color: var(--accent);
        }
        .pa-header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .pa-header-controls select {
            padding: 6px 14px;
            background: var(--surface-2);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 0.85rem;
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .pa-header-controls select:focus {
            border-color: var(--accent);
        }
        .theme-toggle-btn {
            padding: 6px 12px;
            background: var(--surface-2);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle-btn:hover {
            background: var(--accent-light);
            color: var(--accent-dark);
            border-color: var(--accent-mid);
        }

        /* --- SUMMARY CARDS --- */
        .pa-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            padding: 24px 28px 0 28px;
        }
        .pa-summary .card {
            background: var(--surface-2);
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            transition: background var(--transition), border-color var(--transition);
        }
        .pa-summary .card .label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .pa-summary .card .value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 4px;
            transition: color var(--transition);
        }
        .pa-summary .card .sub {
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 4px;
        }
        .pa-summary .card .sub.positive {
            color: var(--status-implemented);
        }
        .pa-summary .card .sub.negative {
            color: var(--status-submitted);
        }
        .pa-summary .card .sub.neutral {
            color: var(--status-review);
        }

        /* ============================================================
           CHART – CLEAN & ALIGNED
           ============================================================ */

        .pa-chart-area {
            padding: 24px 28px 12px 28px;
        }
        .pa-chart-area h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 18px;
            transition: color var(--transition);
        }
        .pa-chart-area h3 i {
            color: var(--accent);
            margin-right: 8px;
        }

        /* ─── chart container ─── */
        .chart-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            gap: 6px;
            height: 280px;
            padding: 0 4px 0 4px;
            border-bottom: 2px solid var(--border);
            transition: border-color var(--transition);
        }

        /* ─── each period column ─── */
        .chart-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 0;
            height: 100%;
            justify-content: flex-end;
        }

        /* ─── bars wrapper ─── */
        .chart-bars {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            height: 220px;
            flex-shrink: 0;
            justify-content: center;
            width: 100%;
        }

        /* ─── individual bar group ─── */
        .bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            gap: 3px;
            flex: 1;
            max-width: 44px;
            min-width: 24px;
        }

        .bar-group .bar-value {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            transition: color var(--transition);
            text-align: center;
            line-height: 1.2;
        }

        .bar-group .bar {
            width: 100%;
            border-radius: 4px 4px 0 0;
            min-height: 3px;
            transition: height 0.5s ease, background 0.2s;
            flex-shrink: 0;
            position: relative;
        }

        .bar-group .bar.projection {
            background: var(--accent);
            opacity: 0.85;
        }
        .bar-group .bar.actual {
            background: var(--status-implemented);
            opacity: 0.85;
        }

        /* ─── hover tooltip ─── */
        .bar-group .bar:hover {
            opacity: 1;
            transform: scaleX(1.05);
            transition: opacity 0.15s, transform 0.15s;
        }

        .bar-group .bar:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: var(--radius-xs);
            font-size: 0.65rem;
            font-weight: 600;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }

        /* ─── period label ─── */
        .chart-period-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
            transition: color var(--transition);
            letter-spacing: 0.02em;
        }

        /* ─── legend ─── */
        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 16px;
            padding-bottom: 4px;
        }
        .chart-legend span {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color var(--transition);
        }
        .chart-legend .dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .chart-legend .dot.projection {
            background: var(--accent);
        }
        .chart-legend .dot.actual {
            background: var(--status-implemented);
        }

        /* --- TABLE AREA --- */
        .pa-table-area {
            padding: 8px 28px 28px 28px;
        }
        .pa-table-area h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            transition: color var(--transition);
        }
        .pa-table-area h3 i {
            color: var(--accent);
            margin-right: 8px;
        }

        .pa-table-wrap {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            transition: border-color var(--transition);
        }
        .pa-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 500px;
        }
        .pa-table th {
            background: var(--surface-2);
            color: var(--text-secondary);
            font-weight: 600;
            padding: 12px 16px;
            text-align: left;
            border-bottom: 2px solid var(--border);
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .pa-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            transition: border-color var(--transition), color var(--transition);
        }
        .pa-table tr:last-child td {
            border-bottom: none;
        }
        .pa-table .variance-badge {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .pa-table .variance-badge.positive {
            background: var(--status-implemented-bg);
            color: var(--status-implemented);
        }
        .pa-table .variance-badge.negative {
            background: var(--status-submitted-bg);
            color: var(--status-submitted);
        }
        .pa-table .variance-badge.neutral {
            background: var(--status-review-bg);
            color: var(--status-review);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .pa-header {
                padding: 16px 18px;
            }
            .pa-header h1 {
                font-size: 1.1rem;
            }
            .pa-summary {
                padding: 16px 18px 0 18px;
                grid-template-columns: 1fr 1fr;
            }
            .pa-chart-area {
                padding: 16px 14px 8px 14px;
            }
            .chart-container {
                height: 220px;
                gap: 4px;
            }
            .chart-bars {
                height: 170px;
                gap: 6px;
            }
            .bar-group {
                max-width: 34px;
                min-width: 18px;
            }
            .bar-group .bar-value {
                font-size: 0.5rem;
            }
            .chart-period-label {
                font-size: 0.55rem;
                margin-top: 6px;
            }
            .pa-table-area {
                padding: 4px 14px 18px 14px;
            }
            .chart-legend {
                gap: 16px;
                flex-wrap: wrap;
            }
            .chart-legend span {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 480px) {
            .pa-summary {
                grid-template-columns: 1fr;
            }
            .chart-container {
                height: 180px;
                gap: 2px;
            }
            .chart-bars {
                height: 140px;
                gap: 4px;
            }
            .bar-group {
                max-width: 28px;
                min-width: 14px;
            }
            .bar-group .bar-value {
                font-size: 0.45rem;
            }
            .chart-period-label {
                font-size: 0.5rem;
            }
            .pa-header-controls select {
                font-size: 0.75rem;
                padding: 4px 10px;
            }
            .theme-toggle-btn {
                font-size: 0.75rem;
                padding: 4px 10px;
            }
            .pa-table {
                font-size: 0.75rem;
                min-width: 380px;
            }
            .pa-table th,
            .pa-table td {
                padding: 8px 10px;
            }
        }

        /* smooth height transition for bars */
        .bar-group .bar {
            will-change: height;
        }
    </style>
</head>
<body>

    <div class="pa-wrapper">

        <!-- ─── HEADER ─── -->
        <header class="pa-header">
            <h1><i class="fas fa-chart-line"></i> Projection vs Actual</h1>
            <div class="pa-header-controls">
                <select id="periodFilter">
                    <option value="monthly">Monthly</option>
                    <option value="quarterly">Quarterly</option>
                    <option value="yearly">Yearly</option>
                </select>
                <button class="theme-toggle-btn" id="themeToggle">
                    <i class="fas fa-moon"></i> <span id="themeLabel">Dark</span>
                </button>
            </div>
        </header>

        <!-- ─── SUMMARY CARDS ─── -->
        <section class="pa-summary">
            <div class="card">
                <div class="label">Total Projected</div>
                <div class="value" id="totalProjected">₦0</div>
            </div>
            <div class="card">
                <div class="label">Total Actual</div>
                <div class="value" id="totalActual">₦0</div>
            </div>
            <div class="card">
                <div class="label">Variance</div>
                <div class="value" id="totalVariance">₦0</div>
                <div class="sub" id="varianceSub">—</div>
            </div>
            <div class="card">
                <div class="label">Accuracy</div>
                <div class="value" id="accuracy">0%</div>
            </div>
        </section>

        <!-- ─── CHART AREA ─── -->
        <section class="pa-chart-area">
            <h3><i class="fas fa-chart-bar"></i> Performance Overview</h3>
            <div class="chart-container" id="chartContainer">
                <!-- rendered by JS -->
            </div>
            <div class="chart-legend">
                <span><span class="dot projection"></span> Projection</span>
                <span><span class="dot actual"></span> Actual</span>
            </div>
        </section>

        <!-- ─── TABLE AREA ─── -->
        <section class="pa-table-area">
            <h3><i class="fas fa-table"></i> Detailed Breakdown</h3>
            <div class="pa-table-wrap">
                <table class="pa-table">
                    <thead>
                        <tr>
                            <th>Period</th>
                            <th>Projection (₦)</th>
                            <th>Actual (₦)</th>
                            <th>Variance (₦)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- rendered by JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── SAMPLE DATA ───
            const monthlyData = [
                { period: 'Jan', projection: 100000, actual: 90000 },
                { period: 'Feb', projection: 120000, actual: 130000 },
                { period: 'Mar', projection: 150000, actual: 140000 },
                { period: 'Apr', projection: 170000, actual: 180000 },
                { period: 'May', projection: 200000, actual: 190000 },
                { period: 'Jun', projection: 220000, actual: 250000 },
                { period: 'Jul', projection: 240000, actual: 230000 },
                { period: 'Aug', projection: 260000, actual: 275000 },
                { period: 'Sep', projection: 280000, actual: 270000 },
                { period: 'Oct', projection: 300000, actual: 310000 },
                { period: 'Nov', projection: 320000, actual: 305000 },
                { period: 'Dec', projection: 350000, actual: 370000 },
            ];

            const quarterlyData = [
                { period: 'Q1', projection: 370000, actual: 360000 },
                { period: 'Q2', projection: 590000, actual: 620000 },
                { period: 'Q3', projection: 780000, actual: 775000 },
                { period: 'Q4', projection: 970000, actual: 985000 },
            ];

            const yearlyData = [
                { period: '2023', projection: 2410000, actual: 2350000 },
                { period: '2024', projection: 2710000, actual: 2740000 },
            ];

            let currentData = monthlyData;
            let darkMode = false;

            // ─── DOM REFS ───
            const chartContainer = document.getElementById('chartContainer');
            const tableBody = document.getElementById('tableBody');
            const totalProjectedEl = document.getElementById('totalProjected');
            const totalActualEl = document.getElementById('totalActual');
            const totalVarianceEl = document.getElementById('totalVariance');
            const varianceSubEl = document.getElementById('varianceSub');
            const accuracyEl = document.getElementById('accuracy');
            const periodFilter = document.getElementById('periodFilter');
            const themeToggle = document.getElementById('themeToggle');
            const themeLabel = document.getElementById('themeLabel');

            // ─── THEME LOGIC ───
            function applyTheme(isDark) {
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeLabel.textContent = 'Light';
                    themeToggle.querySelector('i').className = 'fas fa-sun';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    themeLabel.textContent = 'Dark';
                    themeToggle.querySelector('i').className = 'fas fa-moon';
                }
                darkMode = isDark;
                try {
                    localStorage.setItem('prontox-theme', isDark ? 'dark' : 'light');
                } catch (_) {}
            }

            // load saved theme
            try {
                const saved = localStorage.getItem('prontox-theme');
                if (saved === 'dark') {
                    applyTheme(true);
                } else if (saved === 'light') {
                    applyTheme(false);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    applyTheme(true);
                } else {
                    applyTheme(false);
                }
            } catch (_) {
                applyTheme(false);
            }

            themeToggle.addEventListener('click', () => applyTheme(!darkMode));

            // ─── FORMATTING ───
            function formatCurrency(amount) {
                return '₦' + amount.toLocaleString();
            }

            function formatCurrencyShort(amount) {
                if (amount >= 1000000) return '₦' + (amount / 1000000).toFixed(1) + 'M';
                if (amount >= 1000) return '₦' + (amount / 1000).toFixed(0) + 'K';
                return '₦' + amount.toLocaleString();
            }

            // ─── RENDER FUNCTIONS ───
            function renderSummary(data) {
                const totalProj = data.reduce((sum, d) => sum + d.projection, 0);
                const totalAct = data.reduce((sum, d) => sum + d.actual, 0);
                const variance = totalAct - totalProj;
                const accuracy = totalProj > 0 ? Math.round((totalAct / totalProj) * 100) : 0;

                totalProjectedEl.textContent = formatCurrency(totalProj);
                totalActualEl.textContent = formatCurrency(totalAct);
                totalVarianceEl.textContent = (variance >= 0 ? '+' : '') + formatCurrency(variance);

                let statusText, statusClass;
                if (variance > 0) {
                    statusText = '✅ Over performing';
                    statusClass = 'positive';
                } else if (variance < 0) {
                    statusText = '⚠️ Under performing';
                    statusClass = 'negative';
                } else {
                    statusText = '➖ On target';
                    statusClass = 'neutral';
                }
                varianceSubEl.textContent = statusText;
                varianceSubEl.className = 'sub ' + statusClass;
                accuracyEl.textContent = accuracy + '%';
            }

            // ─── CHART RENDER (clean & aligned) ───
            function renderChart(data) {
                if (!chartContainer) return;
                if (!data || data.length === 0) {
                    chartContainer.innerHTML =
                    '<div style="text-align:center;color:var(--text-muted);padding:40px 0;">No data available</div>';
                    return;
                }

                const maxVal = Math.max(...data.flatMap(d => [d.projection, d.actual]), 1);

                let html = '';
                data.forEach(item => {
                    const projPct = Math.max((item.projection / maxVal) * 100, 3);
                    const actPct = Math.max((item.actual / maxVal) * 100, 3);

                    html += `
                        <div class="chart-column">
                            <div class="chart-bars">
                                <div class="bar-group">
                                    <div class="bar-value">${formatCurrencyShort(item.projection)}</div>
                                    <div class="bar projection" style="height: ${projPct}%;" data-tip="${formatCurrency(item.projection)}"></div>
                                </div>
                                <div class="bar-group">
                                    <div class="bar-value">${formatCurrencyShort(item.actual)}</div>
                                    <div class="bar actual" style="height: ${actPct}%;" data-tip="${formatCurrency(item.actual)}"></div>
                                </div>
                            </div>
                            <div class="chart-period-label">${item.period}</div>
                        </div>
                    `;
                });

                chartContainer.innerHTML = html;
            }

            // ─── TABLE RENDER ───
            function renderTable(data) {
                if (!tableBody) return;
                let html = '';
                data.forEach(item => {
                    const variance = item.actual - item.projection;
                    const pct = item.projection > 0 ? ((variance / item.projection) * 100).toFixed(1) : 0;
                    let statusClass, statusText;
                    if (variance > 0) {
                        statusClass = 'positive';
                        statusText = '✅ +' + pct + '%';
                    } else if (variance < 0) {
                        statusClass = 'negative';
                        statusText = '⚠️ ' + pct + '%';
                    } else {
                        statusClass = 'neutral';
                        statusText = '➖ 0%';
                    }

                    html += `
                        <tr>
                            <td><strong>${item.period}</strong></td>
                            <td>${formatCurrency(item.projection)}</td>
                            <td>${formatCurrency(item.actual)}</td>
                            <td>${(variance >= 0 ? '+' : '') + formatCurrency(variance)}</td>
                            <td><span class="variance-badge ${statusClass}">${statusText}</span></td>
                        </tr>
                    `;
                });
                tableBody.innerHTML = html;
            }

            // ─── RENDER ALL ───
            function renderAll(data) {
                renderSummary(data);
                renderChart(data);
                renderTable(data);
            }

            // ─── DATA FETCHING ───
            function getData(period) {
                switch (period) {
                    case 'quarterly':
                        return quarterlyData;
                    case 'yearly':
                        return yearlyData;
                    default:
                        return monthlyData;
                }
            }

            // ─── EVENT LISTENERS ───
            periodFilter.addEventListener('change', function() {
                const period = this.value;
                currentData = getData(period);
                renderAll(currentData);
            });

            // ─── INIT ───
            renderAll(currentData);

            console.log('✅ Projection vs Actual page ready. Chart aligned & clear.');
        })();
    </script>

</body>
</html>
