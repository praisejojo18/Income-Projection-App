<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prontox · Customers</title>

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ============================================================
           PRONTOX COLOR PALETTE & FONTS
           ============================================================ */
        :root {
            --bg: #F0F4F8;
            --surface: #FFFFFF;
            --surface-2: #F8FAFC;
            --surface-3: #F1F5F9;
            --text-primary: #1A2332;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --accent: #00AFEF;
            --accent-hover: #0099D3;
            --accent-dark: #0088CC;
            --accent-light: #E6F6FE;
            --accent-mid: #B3E5FC;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-light: #fee2e2;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;

            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.08);
            --shadow-sidebar: 4px 0 30px rgba(0, 0, 0, 0.08);

            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-height: 68px;
        }

        [data-theme="dark"] {
            --bg: #0E0F11;
            --surface: #1A1E21;
            --surface-2: #24292E;
            --surface-3: #2D3338;
            --text-primary: #E7E9EB;
            --text-secondary: #AAB0B6;
            --text-muted: #888E99;
            --border: #353E46;
            --accent: #60A5FA;
            --accent-hover: #3B82F6;
            --accent-dark: #2563EB;
            --accent-light: #1a3a5a;
            --accent-mid: #2a4a6a;
            --danger: #f87171;
            --danger-hover: #ef4444;
            --danger-light: #4a1a1a;
            --success: #34d399;
            --success-light: #0a3a2a;
            --warning: #fbbf24;
            --warning-light: #3a2a0a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.5);
            --shadow-sidebar: 4px 0 30px rgba(0, 0, 0, 0.6);
        }

        /* --- RESET & BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background var(--transition), color var(--transition);
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        input, select {
            font-family: inherit;
            outline: none;
        }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            height: var(--nav-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background var(--transition), border-color var(--transition);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
            transition: color var(--transition);
        }
        .nav-logo .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            transition: background var(--transition);
        }
        .nav-logo span {
            color: var(--accent);
            transition: color var(--transition);
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 6px;
            border-radius: var(--radius-xs);
            transition: background 0.2s;
        }
        .hamburger:hover {
            background: var(--surface-2);
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: var(--text-primary);
            border-radius: 4px;
            transition: all 0.25s ease;
            transform-origin: center;
        }
        .hamburger.open span:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }
        .hamburger.open span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .hamburger.open span:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-right .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1rem;
            transition: all 0.2s;
            background: transparent;
        }
        .nav-right .icon-btn:hover {
            background: var(--surface-2);
            color: var(--text-primary);
        }
        .nav-right .avatar {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: var(--accent-light);
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .nav-right .avatar:hover {
            border-color: var(--accent);
        }

        /* ============================================================
           SIDEBAR (grouped)
           ============================================================ */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background var(--transition), border-color var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sidebar);
            overflow-y: auto;
        }
        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-header .close-sidebar {
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: background 0.2s, color 0.2s;
        }
        .sidebar-header .close-sidebar:hover {
            background: var(--surface-2);
            color: var(--text-primary);
        }

        .sidebar-nav {
            padding: 16px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav .nav-group {
            margin-bottom: 6px;
        }
        .sidebar-nav .nav-group:last-child {
            margin-bottom: 0;
        }

        .sidebar-nav .nav-group-label {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 8px 16px 4px 16px;
            user-select: none;
            transition: color var(--transition);
        }

        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: var(--radius-xs);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .sidebar-nav .nav-item i {
            width: 20px;
            font-size: 1rem;
            color: var(--text-muted);
            transition: color 0.15s;
        }
        .sidebar-nav .nav-item:hover {
            background: var(--surface-2);
            color: var(--text-primary);
        }
        .sidebar-nav .nav-item:hover i {
            color: var(--accent);
        }
        .sidebar-nav .nav-item.active {
            background: var(--accent-light);
            color: var(--accent-dark);
            border-left-color: var(--accent);
            font-weight: 600;
        }
        .sidebar-nav .nav-item.active i {
            color: var(--accent);
        }

        .sidebar-nav .nav-item.logout {
            color: var(--danger);
            padding-top: 10px;
        }
        .sidebar-nav .nav-item.logout i {
            color: var(--danger);
        }
        .sidebar-nav .nav-item.logout:hover {
            background: var(--danger-light);
            color: var(--danger-hover);
        }
        .sidebar-nav .nav-item.logout:hover i {
            color: var(--danger-hover);
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            flex: 1;
            padding: 30px 28px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            transition: padding 0.3s;
        }

        .page-header {
            margin-bottom: 28px;
        }
        .page-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            transition: color var(--transition);
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
            transition: color var(--transition);
        }

        /* ============================================================
           CUSTOMER PAGE SPECIFIC STYLES
           ============================================================ */
        .customer-page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--accent);
            color: #fff;
            border-radius: var(--radius-xs);
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: var(--surface-2); border-color: var(--text-muted); }
        .btn-secondary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .btn-danger {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--danger);
            color: #fff;
            border-radius: var(--radius-xs);
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s, transform 0.15s;
        }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-danger:active { transform: scale(0.97); }
        .btn-danger:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }
        .btn-danger:disabled { opacity: 0.6; cursor: not-allowed; }

        .customer-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin: 20px 0 16px;
        }
        .customer-search-wrap {
            position: relative;
            flex: 1;
            min-width: 220px;
        }
        .customer-search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }
        .customer-search-wrap input {
            width: 100%;
            padding: 9px 14px 9px 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            background: var(--surface);
            color: var(--text-primary);
            font-size: 0.85rem;
            transition: border-color 0.2s, background var(--transition), color var(--transition);
        }
        .customer-search-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .customer-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .customer-filters .select-input {
            min-width: 150px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            background: var(--surface);
            color: var(--text-primary);
            font-size: 0.85rem;
            transition: border-color 0.2s, background var(--transition), color var(--transition), border-color var(--transition);
        }
        .customer-filters .select-input:focus {
            border-color: var(--accent);
        }

        .settings-container {
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }

        .customer-table-card {
            border-radius: var(--radius-sm);
        }
        .customer-table-scroll {
            overflow-x: auto;
        }
        .customer-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            min-width: 720px;
        }
        .customer-table thead th {
            text-align: left;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-secondary);
            background: var(--surface-2);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .customer-table thead th.num-col { width: 56px; }
        .customer-table thead th.action-col { text-align: right; }
        .customer-table tbody tr {
            cursor: pointer;
            transition: background 0.18s ease;
        }
        .customer-table tbody tr:hover {
            background: var(--surface-2);
        }
        .customer-table tbody tr:hover td { color: var(--text-primary); }
        .customer-table tbody td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            transition: border-color var(--transition), color var(--transition);
            vertical-align: middle;
        }
        .customer-table tbody tr:last-child td { border-bottom: none; }
        .customer-table .cust-name-cell {
            font-weight: 600;
        }
        .customer-table .row-num {
            color: var(--text-muted);
            font-weight: 500;
        }
        .customer-table .amount-cell {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .customer-table .action-cell {
            text-align: right;
            white-space: nowrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        .status-badge.status-active {
            background: var(--success-light);
            color: var(--success);
        }
        .status-badge.status-expired {
            background: var(--danger-light);
            color: var(--danger);
        }
        .status-badge.status-inactive {
            background: var(--surface-2);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .icon-action-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.18s;
            margin-left: 8px;
        }
        .icon-action-btn:first-child { margin-left: 0; }
        .icon-action-btn:hover {
            background: var(--accent-light);
            color: var(--accent-dark);
            border-color: var(--accent-mid);
        }
        .icon-action-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        .pagination-summary {
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-btn {
            min-width: 34px;
            height: 34px;
            padding: 0 10px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.18s;
        }
        .page-btn:hover:not(:disabled):not(.active) {
            background: var(--surface-2);
            border-color: var(--text-muted);
            color: var(--text-primary);
        }
        .page-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            cursor: default;
        }
        .page-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .page-ellipsis {
            padding: 0 4px;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .customer-empty-state {
            text-align: center;
            padding: 64px 20px;
            color: var(--text-muted);
        }
        .customer-empty-state i {
            font-size: 2.75rem;
            color: var(--border);
            margin-bottom: 14px;
            display: block;
        }
        .customer-empty-state h3 {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .customer-empty-state p {
            font-size: 0.88rem;
            margin-bottom: 18px;
        }

        .customer-profile-view {
            animation: slideIn 0.25s ease;
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .profile-back-btn {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            transition: all 0.2s;
            margin-bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .profile-back-btn:hover {
            background: var(--surface-2);
            border-color: var(--text-muted);
        }

        .profile-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
            transition: background var(--transition), border-color var(--transition);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            transition: border-color var(--transition);
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-light);
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.4rem;
            flex-shrink: 0;
            transition: background var(--transition), color var(--transition);
        }
        .profile-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            transition: color var(--transition);
        }

        .profile-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .profile-detail-item label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 6px;
            transition: color var(--transition);
        }
        .profile-detail-item span {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition);
        }

        .profile-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            transition: border-color var(--transition);
        }
        .profile-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-hover);
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalPop 0.2s ease;
            transition: background var(--transition);
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.96) translateY(6px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            transition: border-color var(--transition);

        .modal-close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1rem;
            transition: all 0.2s;

        .modal-close-btn:hover {

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;

        .form-field {
            margin-bottom: 18px;

        .form-field:last-child { margin-bottom: 0; }
        .form-field label {
            display: block;

            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 7px;
            transition: color var(--transition);

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            background: var(--surface);
            color: var(--text-primary);
            font-size: 0.88rem;
            transition: border-color 0.2s, background var(--transition), color var(--transition);
        }
        .form-field input:focus,
        .form-field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .form-field .field-error {
            font-size: 0.75rem;
            color: var(--danger);
            margin-top: 6px;
            display: none;
        }
        .form-field.has-error input,
        .form-field.has-error select {
            border-color: var(--danger);

        .form-field.has-error .field-error {
            display: block;

        .quick-chips {

        .quick-chip {
            padding: 6px 14px;

            transition: all 0.18s;

        .quick-chip:hover {

        .plan-amount-preview {

        /* responsive for customer table */

    <!-- ─── JAVASCRIPT ─── -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONSTANTS & STATE
            // ============================================================
            const STORAGE_KEY = 'prontox_customers_v1';
            const SEEDED_FLAG_KEY = 'prontox_customers_seeded_v1';
            const PAGE_SIZE = 50;

            // Default plans and their prices (numeric)
            const PLAN_NAMES = [
                'Silver', 'Gold', 'Platinum', 'Premium', 'Premium+',
                'SME Silver', 'SME Gold', 'SME Platinum', 'SME Platinum+'
            ];
            const PLAN_PRICES = {
                'Silver': 5000,
                'Gold': 10000,
                'Platinum': 20000,
                'Premium': 35000,
                'Premium+': 50000,
                'SME Silver': 7500,
                'SME Gold': 15000,
                'SME Platinum': 30000,
                'SME Platinum+': 60000
            };

            let state = {
                search: '',
                plan: 'all',
                status: 'all',
                page: 1,
                currentProfileId: null
            };

            // ============================================================
            // DOM REFS
            // ============================================================
            const addCustomerBtn = document.getElementById('addCustomerBtn');
            const customerListView = document.getElementById('customerListView');
            const customerProfileView = document.getElementById('customerProfileView');
            const customerSearchInput = document.getElementById('customerSearchInput');
            const planFilterEl = document.getElementById('planFilter');
            const statusFilterEl = document.getElementById('statusFilter');
            const customerTableBody = document.getElementById('customerTableBody');
            const customerEmptyState = document.getElementById('customerEmptyState');
            const paginationBar = document.getElementById('paginationBar');
            const paginationSummary = document.getElementById('paginationSummary');
            const paginationControls = document.getElementById('paginationControls');
            const backToCustomersBtn = document.getElementById('backToCustomersBtn');
            const deactivateBtn = document.getElementById('deactivateBtn');
            const profileExtendBtn = document.getElementById('profileExtendBtn');
            const profileChangePlanBtn = document.getElementById('profileChangePlanBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalBox = document.getElementById('modalBox');

            // ============================================================
            // STORAGE HELPERS
            // ============================================================
            function getCustomers() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return [];
                    const parsed = JSON.parse(raw);
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    console.error('Failed to read customers:', e);
                    return [];
                }
            }

            function saveCustomers(list) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
                    return true;
                } catch (e) {
                    console.error('Failed to save customers:', e);
                    return false;
                }
            }

            function addCustomerRecord(customer) {
                const list = getCustomers();
                list.push(customer);
                saveCustomers(list);
            }

            function updateCustomerRecord(id, patch) {
                const list = getCustomers();
                const idx = list.findIndex(c => c.id === id);
                if (idx === -1) return null;
                list[idx] = Object.assign({}, list[idx], patch);
                saveCustomers(list);
                return list[idx];
            }

            function findCustomerById(id) {
                const list = getCustomers();
                return list.find(c => c.id === id) || null;
            }

            function generateId() {
                if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                    return window.crypto.randomUUID();
                }
                return 'cust_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
            }

            // ============================================================
            // HELPERS
            // ============================================================
            function parseLocalDate(dateStr) {
                return new Date(dateStr + 'T00:00:00');
            }

            function calculateStatus(customer) {
                if (!customer || customer.deactivated) return 'Inactive';
                const expiry = parseLocalDate(customer.expiryDate);
                if (isNaN(expiry.getTime())) return 'Inactive';
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                if (today < expiry) return 'Active';
                const twoMonthsAfter = new Date(expiry);
                twoMonthsAfter.setMonth(twoMonthsAfter.getMonth() + 2);
                if (today <= twoMonthsAfter) return 'Expired';
                return 'Inactive';
            }

            function getPlanAmount(planName) {
                return PLAN_PRICES[planName] || 0;
            }

            function formatCurrency(amount) {
                const n = Number(amount) || 0;
                try {
                    return new Intl.NumberFormat('en-NG', {
                        style: 'currency',
                        currency: 'NGN',
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 0
                    }).format(n);
                } catch (e) {
                    return '₦' + n.toLocaleString('en-US');
                }
            }

            function formatDate(dateStr) {
                const d = parseLocalDate(dateStr);
                if (isNaN(d.getTime())) return '—';
                return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function formatDateTime(isoStr) {
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return '—';
                return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function getInitials(name) {
                if (!name) return '?';
                const parts = name.trim().split(/\s+/);
                const initials = parts.slice(0, 2).map(p => p.charAt(0).toUpperCase());
                return initials.join('') || '?';
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str == null ? '' : String(str);
                return div.innerHTML;
            }

            function statusBadgeClass(status) {
                if (status === 'Active') return 'status-active';
                if (status === 'Expired') return 'status-expired';
                return 'status-inactive';
            }

            // ============================================================
            // FILTER & PAGINATION
            // ============================================================
            function getFilteredCustomers() {
                let list = getCustomers();
                list = list.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                const search = state.search.trim().toLowerCase();
                return list.filter(c => {
                    if (search && (!c.name || c.name.toLowerCase().indexOf(search) === -1)) return false;
                    if (state.plan !== 'all' && c.plan !== state.plan) return false;
                    if (state.status !== 'all' && calculateStatus(c) !== state.status) return false;
                    return true;
                });
            }

            function paginate(list, page, pageSize) {
                const totalCount = list.length;
                const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
                const safePage = Math.min(Math.max(1, page), totalPages);
                const start = (safePage - 1) * pageSize;
                const pageItems = list.slice(start, start + pageSize);
                return { pageItems, totalPages, totalCount, page: safePage, start };
            }

            function getPageNumberSequence(current, total) {
                const delta = 1;
                const range = [];
                for (let i = Math.max(2, current - delta); i <= Math.min(total - 1, current + delta); i++) {
                    range.push(i);
                }
                let pages = [];
                if (current - delta > 2) {
                    pages.push(1, '...');
                } else {
                    pages.push(1);
                }
                pages = pages.concat(range);
                if (current + delta < total - 1) {
                    pages.push('...', total);
                } else if (total > 1) {
                    pages.push(total);
                }
                const seen = {};
                return pages.filter(p => {
                    if (p === '...') return true;
                    if (seen[p]) return false;
                    seen[p] = true;
                    return true;
                });
            }

            // ============================================================
            // RENDER: LIST
            // ============================================================
            function renderCustomerList() {
                const allCustomers = getCustomers();
                const filtered = getFilteredCustomers();
                const result = paginate(filtered, state.page, PAGE_SIZE);
                state.page = result.page;

                // Populate plan filter options
                const currentPlan = planFilterEl.value;
                planFilterEl.innerHTML = '<option value="all">All Plans</option>' +
                    PLAN_NAMES.map(p => `<option value="${p}">${p}</option>`).join('');
                planFilterEl.value = currentPlan;

                if (allCustomers.length === 0) {
                    customerTableBody.innerHTML = '';
                    paginationBar.style.display = 'none';
                    showEmptyState('no-customers');
                    return;
                }

                if (filtered.length === 0) {
                    customerTableBody.innerHTML = '';
                    paginationBar.style.display = 'none';
                    showEmptyState('no-matches');
                    return;
                }

                hideEmptyState();

                let rowsHtml = result.pageItems.map((customer, i) => {
                    const rowNum = result.start + i + 1;
                    const status = calculateStatus(customer);
                    const safeName = escapeHtml(customer.name);
                    const safePlan = escapeHtml(customer.plan);
                    return `
                            <tr data-id="${customer.id}" tabindex="0" role="button" aria-label="View profile for ${safeName}">
                                <td class="row-num" data-label="#">${rowNum}</td>
                                <td class="cust-name-cell" data-label="Customer">${safeName}</td>
                                <td data-label="Plan">${safePlan}</td>
                                <td data-label="Status"><span class="status-badge ${statusBadgeClass(status)}">${status}</span></td>
                                <td data-label="Expiry">${formatDate(customer.expiryDate)}</td>
                                <td class="amount-cell" data-label="Amount">${formatCurrency(customer.amount)}</td>
                                <td class="action-cell" data-label="Action">
                                    <button type="button" class="icon-action-btn extend-btn" data-id="${customer.id}" title="Extend Service" aria-label="Extend service for ${safeName}"><i class="fas fa-calendar-plus"></i></button>
                                    <button type="button" class="icon-action-btn change-plan-btn" data-id="${customer.id}" title="Change Plan" aria-label="Change plan for ${safeName}"><i class="fas fa-exchange-alt"></i></button>
                                </td>
                            </tr>
                        `;
                }).join('');

                customerTableBody.innerHTML = rowsHtml;
                renderPagination(result);
            }

            function showEmptyState(kind) {
                let html;
                if (kind === 'no-customers') {
                    html = `
                            <i class="fas fa-user-friends"></i>
                            <h3>No customers yet</h3>
                            <p>Add your first customer to get started.</p>
                            <button type="button" class="btn-primary" id="emptyAddCustomerBtn"><i class="fas fa-plus"></i> Add Customer</button>
                        `;
                } else {
                    html = `
                            <i class="fas fa-filter"></i>
                            <h3>No customers match your current filters</h3>
                            <p>Try adjusting your search or filters.</p>
                            <button type="button" class="btn-secondary" id="clearFiltersBtn"><i class="fas fa-times"></i> Clear Filters</button>
                        `;
                }
                customerEmptyState.innerHTML = html;
                customerEmptyState.style.display = 'block';

                const emptyAddBtn = document.getElementById('emptyAddCustomerBtn');
                if (emptyAddBtn) emptyAddBtn.addEventListener('click', openAddCustomerModal);
                const clearBtn = document.getElementById('clearFiltersBtn');
                if (clearBtn) clearBtn.addEventListener('click', clearFilters);
            }

            function hideEmptyState() {
                customerEmptyState.style.display = 'none';
                customerEmptyState.innerHTML = '';
            }

            function clearFilters() {
                state.search = '';
                state.plan = 'all';
                state.status = 'all';
                state.page = 1;
                customerSearchInput.value = '';
                planFilterEl.value = 'all';
                statusFilterEl.value = 'all';
                renderCustomerList();
            }

            function renderPagination(result) {
                if (result.totalCount <= PAGE_SIZE) {
                    // still show summary
                }
                paginationBar.style.display = 'flex';
                const startNum = result.totalCount === 0 ? 0 : result.start + 1;
                const endNum = Math.min(result.start + PAGE_SIZE, result.totalCount);
                paginationSummary.textContent = 'Showing ' + startNum + '\u2013' + endNum + ' of ' + result.totalCount
                    .toLocaleString('en-US') + ' customers';

                const page = result.page;
                const totalPages = result.totalPages;
                let html = '';
                html += '<button type="button" class="page-btn" data-page="' + (page - 1) + '" ' + (page <= 1 ? 'disabled' :
                    '') + ' aria-label="Previous page"><i class="fas fa-chevron-left"></i></button>';

                const pages = getPageNumberSequence(page, totalPages);
                pages.forEach(p => {
                    if (p === '...') {
                        html += '<span class="page-ellipsis">\u2026</span>';
                    } else {
                        html += '<button type="button" class="page-btn ' + (p === page ? 'active' : '') + '" data-page="' +
                            p + '" aria-label="Page ' + p + '" ' + (p === page ? 'aria-current="page"' : '') + '>' + p +
                            '</button>';
                    }
                });

                html += '<button type="button" class="page-btn" data-page="' + (page + 1) + '" ' + (page >= totalPages ?
                    'disabled' : '') + ' aria-label="Next page"><i class="fas fa-chevron-right"></i></button>';
                paginationControls.innerHTML = html;
            }

            // ============================================================
            // RENDER: PROFILE
            // ============================================================
            function showCustomerListView() {
                state.currentProfileId = null;
                customerProfileView.style.display = 'none';
                customerListView.style.display = 'block';
            }

            function showCustomerProfileView(id) {
                const customer = findCustomerById(id);
                if (!customer) {
                    showCustomerListView();
                    renderCustomerList();
                    return;
                }
                state.currentProfileId = id;
                renderProfile(customer);
                customerListView.style.display = 'none';
                customerProfileView.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function renderProfile(customer) {
                const status = calculateStatus(customer);
                document.getElementById('profileAvatar').textContent = getInitials(customer.name);
                document.getElementById('profileName').textContent = customer.name;

                const badge = document.getElementById('profileStatusBadge');
                badge.className = 'status-badge ' + statusBadgeClass(status);
                badge.textContent = status;

                document.getElementById('profilePlan').textContent = customer.plan;
                document.getElementById('profileExpiry').textContent = formatDate(customer.expiryDate);
                document.getElementById('profileAmount').textContent = formatCurrency(customer.amount);
                document.getElementById('profileId').textContent = customer.id;
                document.getElementById('profileCreatedAt').textContent = formatDateTime(customer.createdAt);

                deactivateBtn.disabled = !!customer.deactivated;
                deactivateBtn.innerHTML = customer.deactivated ?
                    '<i class="fas fa-user-slash"></i> Already Deactivated' :
                    '<i class="fas fa-user-slash"></i> Deactivate Customer';
            }

            // ============================================================
            // MODAL
            // ============================================================
            function openModal(titleText, bodyHtml, footerHtml) {
                modalBox.innerHTML = `
                        <div class="modal-header">
                            <h3>${titleText}</h3>
                            <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="Close"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="modal-body">${bodyHtml}</div>
                        ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
                    `;

                modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';

                document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

                const firstInput = modalBox.querySelector('input, select');
                if (firstInput) setTimeout(() => firstInput.focus(), 50);
            }

            function closeModal() {
                modalOverlay.classList.remove('open');
                document.body.style.overflow = '';
                modalBox.innerHTML = '';
            }

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('open')) {
                    closeModal();
                }
            });

            function planOptionsHtml(selectedPlan) {
                return PLAN_NAMES.map(p =>
                    `<option value="${p}" ${p === selectedPlan ? 'selected' : ''}>${p} (${formatCurrency(PLAN_PRICES[p])})</option>`
                ).join('');
            }

            // ============================================================
            // ADD CUSTOMER
            // ============================================================
            function openAddCustomerModal() {
                const todayIso = new Date().toISOString().slice(0, 10);

                const body = `
                        <div class="form-field" id="addNameField">
                            <label for="addCustomerName">Customer Name</label>
                            <input type="text" id="addCustomerName" placeholder="e.g. Adaeze Okonkwo" autocomplete="off" />
                            <div class="field-error">Please enter a customer name.</div>
                        </div>
                        <div class="form-field" id="addPlanField">
                            <label for="addCustomerPlan">Plan</label>
                            <select id="addCustomerPlan">${planOptionsHtml(PLAN_NAMES[0])}</select>
                        </div>
                        <div class="form-field" id="addExpiryField">
                            <label for="addCustomerExpiry">Expiry Date</label>
                            <input type="date" id="addCustomerExpiry" value="" min="${todayIso}" />
                            <div class="field-error">Please choose a valid expiry date.</div>
                        </div>
                    `;

                const footer = `
                        <button type="button" class="btn-secondary" id="cancelAddCustomer">Cancel</button>
                        <button type="button" class="btn-primary" id="confirmAddCustomer"><i class="fas fa-check"></i> Add Customer</button>
                    `;

                openModal('Add Customer', body, footer);

                document.getElementById('cancelAddCustomer').addEventListener('click', closeModal);
                document.getElementById('confirmAddCustomer').addEventListener('click', handleAddCustomer);

                const nameInput = document.getElementById('addCustomerName');
                nameInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') handleAddCustomer();
                });
            }

            function handleAddCustomer() {
                const nameInput = document.getElementById('addCustomerName');
                const planSelect = document.getElementById('addCustomerPlan');
                const expiryInput = document.getElementById('addCustomerExpiry');

                const name = nameInput.value.trim();
                const plan = planSelect.value;
                const expiry = expiryInput.value;

                const nameField = document.getElementById('addNameField');
                const expiryField = document.getElementById('addExpiryField');
                nameField.classList.remove('has-error');
                expiryField.classList.remove('has-error');

                let valid = true;
                if (!name) {
                    nameField.classList.add('has-error');
                    valid = false;
                }
                if (!expiry || isNaN(parseLocalDate(expiry).getTime())) {
                    expiryField.classList.add('has-error');
                    valid = false;
                }
                if (!valid) return;

                const customer = {
                    id: generateId(),
                    name: name,
                    plan: plan,
                    expiryDate: expiry,
                    amount: getPlanAmount(plan),
                    createdAt: new Date().toISOString(),
                    deactivated: false
                };

                addCustomerRecord(customer);
                closeModal();

                // reset filters so the new customer is visible
                clearFilters();
            }

            // ============================================================
            // EXTEND SERVICE
            // ============================================================
            function openExtendServiceModal(id) {
                const customer = findCustomerById(id);
                if (!customer) return;

                const currentExpiry = parseLocalDate(customer.expiryDate);
                const baseDate = currentExpiry.getTime() > Date.now() ? currentExpiry : new Date();

                const body = `
                        <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:14px;">
                            Current expiry: <strong style="color:var(--text-primary);">${formatDate(customer.expiryDate)}</strong>
                        </p>
                        <div class="quick-chips">
                            <button type="button" class="quick-chip" data-months="1">+1 Month</button>
                            <button type="button" class="quick-chip" data-months="3">+3 Months</button>
                            <button type="button" class="quick-chip" data-months="6">+6 Months</button>
                            <button type="button" class="quick-chip" data-months="12">+12 Months</button>
                        </div>
                        <div class="form-field" id="extendDateField">
                            <label for="extendExpiryInput">New Expiry Date</label>
                            <input type="date" id="extendExpiryInput" value="${customer.expiryDate}" />
                            <div class="field-error">Please choose a valid date.</div>
                        </div>
                    `;

                const footer = `
                        <button type="button" class="btn-secondary" id="cancelExtend">Cancel</button>
                        <button type="button" class="btn-primary" id="confirmExtend"><i class="fas fa-check"></i> Extend Service</button>
                    `;

                openModal('Extend Service', body, footer);

                const dateInput = document.getElementById('extendExpiryInput');

                document.querySelectorAll('.quick-chip').forEach(chip => {
                    chip.addEventListener('click', function() {
                        const months = parseInt(this.getAttribute('data-months'), 10);
                        const d = new Date(baseDate);
                        d.setMonth(d.getMonth() + months);
                        dateInput.value = d.toISOString().slice(0, 10);
                    });
                });

                document.getElementById('cancelExtend').addEventListener('click', closeModal);
                document.getElementById('confirmExtend').addEventListener('click', function() {
                    handleExtendService(id);
                });
            }

            function handleExtendService(id) {
                const dateInput = document.getElementById('extendExpiryInput');
                const field = document.getElementById('extendDateField');
                const newExpiry = dateInput.value;

                field.classList.remove('has-error');
                if (!newExpiry || isNaN(parseLocalDate(newExpiry).getTime())) {
                    field.classList.add('has-error');
                    return;
                }

                updateCustomerRecord(id, { expiryDate: newExpiry, deactivated: false });
                closeModal();

                if (state.currentProfileId === id) {
                    renderProfile(findCustomerById(id));
                }
                renderCustomerList();
            }

            // ============================================================
            // CHANGE PLAN
            // ============================================================
            function openChangePlanModal(id) {
                const customer = findCustomerById(id);
                if (!customer) return;

                const body = `
                        <div class="form-field">
                            <label for="changePlanSelect">New Plan</label>
                            <select id="changePlanSelect">${planOptionsHtml(customer.plan)}</select>
                        </div>
                        <div class="plan-amount-preview" id="planAmountPreview">
                            New amount: ${formatCurrency(getPlanAmount(customer.plan))}
                        </div>
                    `;

                const footer = `
                        <button type="button" class="btn-secondary" id="cancelChangePlan">Cancel</button>
                        <button type="button" class="btn-primary" id="confirmChangePlan"><i class="fas fa-check"></i> Change Plan</button>
                    `;

                openModal('Change Plan', body, footer);

                const select = document.getElementById('changePlanSelect');
                const preview = document.getElementById('planAmountPreview');
                select.addEventListener('change', function() {
                    preview.textContent = 'New amount: ' + formatCurrency(getPlanAmount(select.value));
                });

                document.getElementById('cancelChangePlan').addEventListener('click', closeModal);
                document.getElementById('confirmChangePlan').addEventListener('click', function() {
                    handleChangePlan(id);
                });
            }

            function handleChangePlan(id) {
                const select = document.getElementById('changePlanSelect');
                const newPlan = select.value;

                updateCustomerRecord(id, { plan: newPlan, amount: getPlanAmount(newPlan) });
                closeModal();

                if (state.currentProfileId === id) {
                    renderProfile(findCustomerById(id));
                }
                renderCustomerList();
            }

            // ============================================================
            // DEACTIVATE
            // ============================================================
            function openDeactivateConfirm(id) {
                const customer = findCustomerById(id);
                if (!customer || customer.deactivated) return;

                const body = `
                        <div class="confirm-icon"><i class="fas fa-user-slash"></i></div>
                        <p class="confirm-text">Are you sure you want to deactivate <strong>${escapeHtml(customer.name)}</strong>?
                        Their account status will permanently change to Inactive. This cannot be undone from here.</p>
                    `;

                const footer = `
                        <button type="button" class="btn-secondary" id="cancelDeactivate">Cancel</button>
                        <button type="button" class="btn-danger" id="confirmDeactivate"><i class="fas fa-user-slash"></i> Deactivate</button>
                    `;

                openModal('Deactivate Customer', body, footer);

                document.getElementById('cancelDeactivate').addEventListener('click', closeModal);
                document.getElementById('confirmDeactivate').addEventListener('click', function() {
                    updateCustomerRecord(id, { deactivated: true });
                    closeModal();
                    if (state.currentProfileId === id) {
                        renderProfile(findCustomerById(id));
                    }
                    renderCustomerList();
                });
            }

            // ============================================================
            // EVENT WIRING
            // ============================================================
            addCustomerBtn.addEventListener('click', openAddCustomerModal);

            let searchDebounceTimer = null;
            customerSearchInput.addEventListener('input', function() {
                clearTimeout(searchDebounceTimer);
                const value = this.value;
                searchDebounceTimer = setTimeout(function() {
                    state.search = value;
                    state.page = 1;
                    renderCustomerList();
                }, 150);
            });

            planFilterEl.addEventListener('change', function() {
                state.plan = this.value;
                state.page = 1;
                renderCustomerList();
            });

            statusFilterEl.addEventListener('change', function() {
                state.status = this.value;
                state.page = 1;
                renderCustomerList();
            });

            customerTableBody.addEventListener('click', function(e) {
                const extendBtn = e.target.closest('.extend-btn');
                if (extendBtn) {
                    e.stopPropagation();
                    openExtendServiceModal(extendBtn.getAttribute('data-id'));
                    return;
                }
                const changePlanBtn = e.target.closest('.change-plan-btn');
                if (changePlanBtn) {
                    e.stopPropagation();
                    openChangePlanModal(changePlanBtn.getAttribute('data-id'));
                    return;
                }
                const row = e.target.closest('tr[data-id]');
                if (row) {
                    showCustomerProfileView(row.getAttribute('data-id'));
                }
            });

            customerTableBody.addEventListener('keydown', function(e) {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                const row = e.target.closest('tr[data-id]');
                if (row && e.target === row) {
                    e.preventDefault();
                    showCustomerProfileView(row.getAttribute('data-id'));
                }
            });

            paginationControls.addEventListener('click', function(e) {
                const btn = e.target.closest('.page-btn');
                if (!btn || btn.disabled) return;
                const page = parseInt(btn.getAttribute('data-page'), 10);
                if (isNaN(page)) return;
                state.page = page;
                renderCustomerList();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            backToCustomersBtn.addEventListener('click', function() {
                showCustomerListView();
                renderCustomerList();
            });

            deactivateBtn.addEventListener('click', function() {
                if (state.currentProfileId) openDeactivateConfirm(state.currentProfileId);
            });

            profileExtendBtn.addEventListener('click', function() {
                if (state.currentProfileId) openExtendServiceModal(state.currentProfileId);
            });

            profileChangePlanBtn.addEventListener('click', function() {
                if (state.currentProfileId) openChangePlanModal(state.currentProfileId);
            });

            // ============================================================
            // SEED DATA
            // ============================================================
            function seedInitialData() {
                let alreadySeeded = false;
                try { alreadySeeded = localStorage.getItem(SEEDED_FLAG_KEY) === 'true'; } catch (e) {}

                if (alreadySeeded || getCustomers().length > 0) return;

                const names = [
                    'Adaeze Okonkwo', 'Chinedu Williams', 'Fatima Bello', 'Emeka Nwosu',
                    'Ngozi Adeyemi', 'Tunde Balogun', 'Blessing Eze', 'Ibrahim Suleiman',
                    'Chiamaka Obi', 'Segun Afolabi', 'Amaka Chukwu', 'David Okafor',
                    'Halima Yusuf', 'Peter Ogunleye'
                ];

                function isoDateFromToday(offsetDays) {
                    const d = new Date();
                    d.setDate(d.getDate() + offsetDays);
                    return d.toISOString().slice(0, 10);
                }

                const offsets = [45, 20, 5, -10, -25, -50, -70, 90, -3, 15, 60, -100, 30, -15];

                const seeded = names.map((name, i) => {
                    const plan = PLAN_NAMES[i % PLAN_NAMES.length];
                    const expiryDate = isoDateFromToday(offsets[i % offsets.length]);
                    const createdOffsetDays = Math.floor(Math.random() * 180) + 10;
                    const createdAt = new Date(Date.now() - createdOffsetDays * 86400000).toISOString();
                    return {
                        id: generateId(),
                        name: name,
                        plan: plan,
                        expiryDate: expiryDate,
                        amount: getPlanAmount(plan),
                        createdAt: createdAt,
                        deactivated: false
                    };
                });

                saveCustomers(seeded);
                try { localStorage.setItem(SEEDED_FLAG_KEY, 'true'); } catch (e) {}
            }

            // Dev helper: generate N extra customers to stress-test pagination/perf.
            window.seedTestCustomers = function(count) {
                count = count || 1000;
                const list = getCustomers();
                for (let i = 0; i < count; i++) {
                    const plan = PLAN_NAMES[i % PLAN_NAMES.length];
                    const offsetDays = (i % 5 === 0) ? -80 : (i % 3 === 0) ? -20 : 60;
                    const d = new Date();
                    d.setDate(d.getDate() + offsetDays);
                    list.push({
                        id: generateId(),
                        name: 'Test Customer ' + (i + 1),
                        plan: plan,
                        expiryDate: d.toISOString().slice(0, 10),
                        amount: getPlanAmount(plan),
                        createdAt: new Date().toISOString(),
                        deactivated: false
                    });
                }
                saveCustomers(list);
                renderCustomerList();
                console.log('Seeded ' + count + ' test customers. Total: ' + list.length);
            };

            seedInitialData();

            // ============================================================
            // SIDEBAR & THEME (shared across pages)
            // ============================================================
            // Sidebar toggle
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const closeSidebarBtn = document.getElementById('closeSidebarBtn');

            function openSidebar() {
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('open');
                hamburgerBtn.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('open');
                hamburgerBtn.classList.remove('open');
                document.body.style.overflow = '';
            }

            hamburgerBtn.addEventListener('click', function() {
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            });
            closeSidebarBtn.addEventListener('click', closeSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
            });

            // Theme toggle
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            let darkMode = false;

            function applyTheme(isDark) {
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeIcon.className = 'fas fa-sun';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    themeIcon.className = 'fas fa-moon';
                }
                darkMode = isDark;
                try { localStorage.setItem('prontox-theme', isDark ? 'dark' : 'light'); } catch (_) {}
            }

            try {
                const saved = localStorage.getItem('prontox-theme');
                if (saved === 'dark') applyTheme(true);
                else if (saved === 'light') applyTheme(false);
                else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme(true);
                else applyTheme(false);
            } catch (_) { applyTheme(false); }

            themeToggle.addEventListener('click', () => applyTheme(!darkMode));

            // Logo link (go to dashboard)
            document.getElementById('logoLink').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'dashboard.html';
            });

            // Avatar click
            document.getElementById('avatarBtn').addEventListener('click', function() {
                alert('👤 User profile – would open user settings.');
            });

           // ─── LOGOUT ───
logoutBtn.addEventListener('click', function(e) {
    e.preventDefault();
    if (confirm('Are you sure you want to log out?')) {
        // Clear session from localStorage
        localStorage.removeItem('prontox_session');
        // Redirect to login page
        window.location.href = 'login.html';
    }
});

            // ============================================================
            // INIT
            // ============================================================
            renderCustomerList();
            console.log('✅ Customer page ready.');
        })();
    </script>

</body>
</html>
