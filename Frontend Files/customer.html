<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prontox · Customers</title>

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ============================================================
           PRONTOX COLOR PALETTE & FONTS
           ============================================================ */
        :root {
            --bg: #F0F4F8;
            --surface: #FFFFFF;
            --surface-2: #F8FAFC;
            --surface-3: #F1F5F9;
            --text-primary: #1A2332;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --accent: #00AFEF;
            --accent-hover: #0099D3;
            --accent-dark: #0088CC;
            --accent-light: #E6F6FE;
            --accent-mid: #B3E5FC;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-light: #fee2e2;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;

            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.08);
            --shadow-sidebar: 4px 0 30px rgba(0, 0, 0, 0.08);

            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-height: 68px;
        }

        [data-theme="dark"] {
            --bg: #0E0F11;
            --surface: #1A1E21;
            --surface-2: #24292E;
            --surface-3: #2D3338;
            --text-primary: #E7E9EB;
            --text-secondary: #AAB0B6;
            --text-muted: #888E99;
            --border: #353E46;
            --accent: #60A5FA;
            --accent-hover: #3B82F6;
            --accent-dark: #2563EB;
            --accent-light: #1a3a5a;
            --accent-mid: #2a4a6a;
            --danger: #f87171;
            --danger-hover: #ef4444;
            --danger-light: #4a1a1a;
            --success: #34d399;
            --success-light: #0a3a2a;
            --warning: #fbbf24;
            --warning-light: #3a2a0a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.5);
            --shadow-sidebar: 4px 0 30px rgba(0, 0, 0, 0.6);
        }

        /* --- RESET & BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background var(--transition), color var(--transition);
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        input, select {
            font-family: inherit;
            outline: none;
        }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            height: var(--nav-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background var(--transition), border-color var(--transition);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
            transition: color var(--transition);
        }
        .nav-logo .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            transition: background var(--transition);
        }
        .nav-logo span {
            color: var(--accent);
            transition: color var(--transition);
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 6px;
            border-radius: var(--radius-xs);
            transition: background 0.2s;
        }
        .hamburger:hover {
            background: var(--surface-2);
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: var(--text-primary);
            border-radius: 4px;
            transition: all 0.25s ease;
            transform-origin: center;
        }
        .hamburger.open span:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }
        .hamburger.open span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .hamburger.open span:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-right .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1rem;
            transition: all 0.2s;
            background: transparent;
        }
        .nav-right .icon-btn:hover {
            background: var(--surface-2);
            color: var(--text-primary);
        }
        .nav-right .avatar {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: var(--accent-light);
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .nav-right .avatar:hover {
            border-color: var(--accent);
        }

        /* ============================================================
           SIDEBAR (grouped)
           ============================================================ */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background var(--transition), border-color var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sidebar);
            overflow-y: auto;
        }
        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-header .close-sidebar {
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: background 0.2s, color 0.2s;
        }
        .sidebar-header .close-sidebar:hover {
            background: var(--surface-2);
            color: var(--text-primary);
        }

        .sidebar-nav {
            padding: 16px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav .nav-group {
            margin-bottom: 6px;
        }
        .sidebar-nav .nav-group:last-child {
            margin-bottom: 0;
        }

        .sidebar-nav .nav-group-label {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 8px 16px 4px 16px;
            user-select: none;
            transition: color var(--transition);
        }

        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: var(--radius-xs);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .sidebar-nav .nav-item i {
            width: 20px;
            font-size: 1rem;
            color: var(--text-muted);
            transition: color 0.15s;
        }
        .sidebar-nav .nav-item:hover {
            background: var(--surface-2);
            color: var(--text-primary);
        }
        .sidebar-nav .nav-item:hover i {
            color: var(--accent);
        }
        .sidebar-nav .nav-item.active {
            background: var(--accent-light);
            color: var(--accent-dark);
            border-left-color: var(--accent);
            font-weight: 600;
        }
        .sidebar-nav .nav-item.active i {
            color: var(--accent);
        }

        .sidebar-nav .nav-item.logout {
            color: var(--danger);
            padding-top: 10px;
        }
        .sidebar-nav .nav-item.logout i {
            color: var(--danger);
        }
        .sidebar-nav .nav-item.logout:hover {
            background: var(--danger-light);
            color: var(--danger-hover);
        }
        .sidebar-nav .nav-item.logout:hover i {
            color: var(--danger-hover);
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            flex: 1;
            padding: 30px 28px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            transition: padding 0.3s;
        }

        .page-header {
            margin-bottom: 28px;
        }
        .page-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            transition: color var(--transition);
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
            transition: color var(--transition);
        }

        /* ============================================================
           CUSTOMER PAGE SPECIFIC STYLES
           ============================================================ */
        .customer-page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--accent);
            color: #fff;
            border-radius: var(--radius-xs);
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: var(--surface-2); border-color: var(--text-muted); }
        .btn-secondary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .btn-danger {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--danger);
            color: #fff;
            border-radius: var(--radius-xs);
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s, transform 0.15s;
        }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-danger:active { transform: scale(0.97); }
        .btn-danger:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }
        .btn-danger:disabled { opacity: 0.6; cursor: not-allowed; }

        .customer-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin: 20px 0 16px;
        }
        .customer-search-wrap {
            position: relative;
            flex: 1;
            min-width: 220px;
        }
        .customer-search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }
        .customer-search-wrap input {
            width: 100%;
            padding: 9px 14px 9px 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            background: var(--surface);
            color: var(--text-primary);
            font-size: 0.85rem;
            transition: border-color 0.2s, background var(--transition), color var(--transition);
        }
        .customer-search-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .customer-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .customer-filters .select-input {
            min-width: 150px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            background: var(--surface);
            color: var(--text-primary);
            font-size: 0.85rem;
            transition: border-color 0.2s, background var(--transition), color var(--transition), border-color var(--transition);
        }
        .customer-filters .select-input:focus {
            border-color: var(--accent);
        }

        .settings-container {
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }

        .customer-table-card {
            border-radius: var(--radius-sm);
        }
        .customer-table-scroll {
            overflow-x: auto;
        }
        .customer-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            min-width: 720px;
        }
        .customer-table thead th {
            text-align: left;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-secondary);
            background: var(--surface-2);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .customer-table thead th.num-col { width: 56px; }
        .customer-table thead th.action-col { text-align: right; }
        .customer-table tbody tr {
            cursor: pointer;
            transition: background 0.18s ease;
        }
        .customer-table tbody tr:hover {
            background: var(--surface-2);
        }
        .customer-table tbody tr:hover td { color: var(--text-primary); }
        .customer-table tbody td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            transition: border-color var(--transition), color var(--transition);
            vertical-align: middle;
        }
        .customer-table tbody tr:last-child td { border-bottom: none; }
        .customer-table .cust-name-cell {
            font-weight: 600;
        }
        .customer-table .row-num {
            color: var(--text-muted);
            font-weight: 500;
        }
        .customer-table .amount-cell {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .customer-table .action-cell {
            text-align: right;
            white-space: nowrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        .status-badge.status-active {
            background: var(--success-light);
            color: var(--success);
        }
        .status-badge.status-expired {
            background: var(--danger-light);
            color: var(--danger);
        }
        .status-badge.status-inactive {
            background: var(--surface-2);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .icon-action-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.18s;
            margin-left: 8px;
        }
        .icon-action-btn:first-child { margin-left: 0; }
        .icon-action-btn:hover {
            background: var(--accent-light);
            color: var(--accent-dark);
            border-color: var(--accent-mid);
        }
        .icon-action-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        .pagination-summary {
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-btn {
            min-width: 34px;
            height: 34px;
            padding: 0 10px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.18s;
        }
        .page-btn:hover:not(:disabled):not(.active) {
            background: var(--surface-2);
            border-color: var(--text-muted);
            color: var(--text-primary);
        }
        .page-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            cursor: default;
        }
        .page-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .page-ellipsis {
            padding: 0 4px;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .customer-empty-state {
            text-align: center;
            padding: 64px 20px;
            color: var(--text-muted);
        }
        .customer-empty-state i {
            font-size: 2.75rem;
            color: var(--border);
            margin-bottom: 14px;
            display: block;
        }
        .customer-empty-state h3 {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .customer-empty-state p {
            font-size: 0.88rem;
            margin-bottom: 18px;
        }

        .customer-profile-view {
            animation: slideIn 0.25s ease;
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .profile-back-btn {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            transition: all 0.2s;
            margin-bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .profile-back-btn:hover {
            background: var(--surface-2);
            border-color: var(--text-muted);
        }

        .profile-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
            transition: background var(--transition), border-color var(--transition);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            transition: border-color var(--transition);
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-light);
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.4rem;
            flex-shrink: 0;
            transition: background var(--transition), color var(--transition);
        }
        .profile-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            transition: color var(--transition);
        }

        .profile-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .profile-detail-item label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 6px;
            transition: color var(--transition);
        }
        .profile-detail-item span {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition);
        }

        .profile-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            transition: border-color var(--transition);
        }
        .profile-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-hover);
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;

    <!-- ─── JAVASCRIPT ─── -->
   <script>
(function() {
    'use strict';

    // ============================================================
    // API CONFIG & STATE
    // ============================================================
    const API = 'http://localhost:5001/api';
    const PAGE_SIZE = 50;

    let allCustomers = [];
    let allPlans = [];

    let state = {
        search: '',
        plan: 'all',
        status: 'all',
        page: 1,
        currentProfileId: null
    };

    const getHeaders = () => {
        const h = { 'Content-Type': 'application/json' };
        const token = localStorage.getItem('prontolog_token');
        if (token) h['Authorization'] = 'Bearer ' + token;
        h['x-user-id'] = localStorage.getItem('prontolog_user_id') || 'af606104-2914-4b9c-9c1d-c3a103642103';
        return h;
    };

    // ============================================================
    // DOM REFS (Exact same IDs as his HTML)
    // ============================================================
    const addCustomerBtn = document.getElementById('addCustomerBtn');
    const customerListView = document.getElementById('customerListView');
    const customerProfileView = document.getElementById('customerProfileView');
    const customerSearchInput = document.getElementById('customerSearchInput');
    const planFilterEl = document.getElementById('planFilter');
    const statusFilterEl = document.getElementById('statusFilter');
    const customerTableBody = document.getElementById('customerTableBody');
    const customerEmptyState = document.getElementById('customerEmptyState');
    const paginationBar = document.getElementById('paginationBar');
    const paginationSummary = document.getElementById('paginationSummary');
    const paginationControls = document.getElementById('paginationControls');
    const backToCustomersBtn = document.getElementById('backToCustomersBtn');
    const deactivateBtn = document.getElementById('deactivateBtn');
    const profileExtendBtn = document.getElementById('profileExtendBtn');
    const profileChangePlanBtn = document.getElementById('profileChangePlanBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalBox = document.getElementById('modalBox');

    // ============================================================
    // HELPERS
    // ============================================================
    function formatCurrency(amount) {
        const n = Number(amount) || 0;
        try { return new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n); } 
        catch (e) { return '₦' + n.toLocaleString('en-US'); }
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return '—';
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function getInitials(name) {
        if (!name) return '?';
        const parts = name.trim().split(/\s+/);
        return parts.slice(0, 2).map(p => p.charAt(0).toUpperCase()).join('') || '?';
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }

    function statusBadgeClass(status) {
        if (status === 'Active') return 'status-active';
        if (status === 'Expired') return 'status-expired';
        return 'status-inactive';
    }

    // Backend sends displayStatus ("Active", "Expired", "Inactive") directly!
    function calculateStatus(customer) {
        return customer.displayStatus || 'Inactive';
    }

    // ============================================================
    // DATA LOADING (Replaces localStorage)
    // ============================================================
    async function loadInitialData() {
        try {
            const res = await fetch(`${API}/customers`, { headers: getHeaders() });
            const data = await res.json();
            allCustomers = Array.isArray(data) ? data : [];

            // Fetch plans for dropdowns
                      try {
                // Fetch from our new, working endpoint instead of his broken one
                const pRes = await fetch(`${API}/customers/plans`, { headers: getHeaders() });
                if (pRes.ok) {
                    const pData = await pRes.json();
                    allPlans = Array.isArray(pData) ? pData : [];
                }
            } catch(e) { console.error("Failed to load plans", e); }

            // Fallback: If /api/plans is blocked by his auth, extract unique plans from customers
            if (allPlans.length === 0 && allCustomers.length > 0) {
                const planMap = {};
                allCustomers.forEach(c => {
                    if (c.plan && c.plan.id) planMap[c.plan.id] = { id: c.plan.id, name: c.plan.name, price: c.plan.price };
                });
                allPlans = Object.values(planMap);
            }

            renderCustomerList();
        } catch (err) {
            console.error('Failed to load customers:', err);
        }
    }

    // ============================================================
    // FILTER & PAGINATION
    // ============================================================
    function getFilteredCustomers() {
        let list = allCustomers.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        const search = state.search.trim().toLowerCase();
        return list.filter(c => {
            if (search && (!c.name || c.name.toLowerCase().indexOf(search) === -1)) return false;
            if (state.plan !== 'all' && c.planId !== state.plan) return false;
            if (state.status !== 'all' && calculateStatus(c) !== state.status) return false;
            return true;
        });
    }

    function paginate(list, page, pageSize) {
        const totalCount = list.length;
        const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
        const safePage = Math.min(Math.max(1, page), totalPages);
        const start = (safePage - 1) * pageSize;
        return { pageItems: list.slice(start, start + pageSize), totalPages, totalCount, page: safePage, start };
    }

    function getPageNumberSequence(current, total) {
        const delta = 1, range = [];
        for (let i = Math.max(2, current - delta); i <= Math.min(total - 1, current + delta); i++) range.push(i);
        let pages = [];
        if (current - delta > 2) pages.push(1, '...'); else pages.push(1);
        pages = pages.concat(range);
        if (current + delta < total - 1) pages.push('...', total); else if (total > 1) pages.push(total);
        const seen = {};
        return pages.filter(p => { if (p === '...') return true; if (seen[p]) return false; seen[p] = true; return true; });
    }

    // ============================================================
    // RENDER: LIST
    // ============================================================
    function renderCustomerList() {
        const filtered = getFilteredCustomers();
        const result = paginate(filtered, state.page, PAGE_SIZE);
        state.page = result.page;

        const currentPlan = planFilterEl.value;
        planFilterEl.innerHTML = '<option value="all">All Plans</option>' +
            allPlans.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        planFilterEl.value = currentPlan || 'all';

        if (allCustomers.length === 0) {
            customerTableBody.innerHTML = '';
            paginationBar.style.display = 'none';
            showEmptyState('no-customers');
            return;
        }
        if (filtered.length === 0) {
            customerTableBody.innerHTML = '';
            paginationBar.style.display = 'none';
            showEmptyState('no-matches');
            return;
        }

        hideEmptyState();

        let rowsHtml = result.pageItems.map((c, i) => {
            const rowNum = result.start + i + 1;
            const status = calculateStatus(c);
            const safeName = escapeHtml(c.name);
            const safePlan = escapeHtml(c.plan?.name || 'Unknown');
            return `
                <tr data-id="${c.id}" tabindex="0" role="button">
                    <td class="row-num">${rowNum}</td>
                    <td class="cust-name-cell">${safeName}</td>
                    <td>${safePlan}</td>
                    <td><span class="status-badge ${statusBadgeClass(status)}">${status}</span></td>
                    <td>${formatDate(c.expiryDate)}</td>
                    <td class="amount-cell">${formatCurrency(c.amount || c.plan?.price)}</td>
                    <td class="action-cell">
                        <button type="button" class="icon-action-btn extend-btn" data-id="${c.id}" title="Extend Service"><i class="fas fa-calendar-plus"></i></button>
                        <button type="button" class="icon-action-btn change-plan-btn" data-id="${c.id}" title="Change Plan"><i class="fas fa-exchange-alt"></i></button>
                    </td>
                </tr>`;
        }).join('');

        customerTableBody.innerHTML = rowsHtml;
        renderPagination(result);
    }

    function showEmptyState(kind) {
        let html = kind === 'no-customers' 
            ? `<i class="fas fa-user-friends"></i><h3>No customers yet</h3><p>Add your first customer to get started.</p><button type="button" class="btn-primary" id="emptyAddCustomerBtn"><i class="fas fa-plus"></i> Add Customer</button>`
            : `<i class="fas fa-filter"></i><h3>No customers match your current filters</h3><p>Try adjusting your search or filters.</p><button type="button" class="btn-secondary" id="clearFiltersBtn"><i class="fas fa-times"></i> Clear Filters</button>`;
        customerEmptyState.innerHTML = html;
        customerEmptyState.style.display = 'block';
        const emptyAddBtn = document.getElementById('emptyAddCustomerBtn');
        if (emptyAddBtn) emptyAddBtn.addEventListener('click', openAddCustomerModal);
        const clearBtn = document.getElementById('clearFiltersBtn');
        if (clearBtn) clearBtn.addEventListener('click', clearFilters);
    }

    function hideEmptyState() { customerEmptyState.style.display = 'none'; customerEmptyState.innerHTML = ''; }

    function clearFilters() {
        state.search = ''; state.plan = 'all'; state.status = 'all'; state.page = 1;
        customerSearchInput.value = ''; planFilterEl.value = 'all'; statusFilterEl.value = 'all';
        renderCustomerList();
    }

    function renderPagination(result) {
        paginationBar.style.display = 'flex';
        const startNum = result.totalCount === 0 ? 0 : result.start + 1;
        const endNum = Math.min(result.start + PAGE_SIZE, result.totalCount);
        paginationSummary.textContent = `Showing ${startNum}–${endNum} of ${result.totalCount.toLocaleString('en-US')} customers`;
        const page = result.page, totalPages = result.totalPages;
        let html = `<button type="button" class="page-btn" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;
        getPageNumberSequence(page, totalPages).forEach(p => {
            if (p === '...') html += `<span class="page-ellipsis">…</span>`;
            else html += `<button type="button" class="page-btn ${p === page ? 'active' : ''}" data-page="${p}">${p}</button>`;
        });
        html += `<button type="button" class="page-btn" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
        paginationControls.innerHTML = html;
    }

    // ============================================================
    // RENDER: PROFILE
    // ============================================================
    function showCustomerListView() { state.currentProfileId = null; customerProfileView.style.display = 'none'; customerListView.style.display = 'block'; }
    
    function showCustomerProfileView(id) {
        const customer = allCustomers.find(c => c.id === id);
        if (!customer) return showCustomerListView();
        state.currentProfileId = id;
        renderProfile(customer);
        customerListView.style.display = 'none';
        customerProfileView.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderProfile(c) {
        const status = calculateStatus(c);
        document.getElementById('profileAvatar').textContent = getInitials(c.name);
        document.getElementById('profileName').textContent = c.name;
        const badge = document.getElementById('profileStatusBadge');
        badge.className = 'status-badge ' + statusBadgeClass(status);
        badge.textContent = status;
        document.getElementById('profilePlan').textContent = c.plan?.name || 'Unknown';
        document.getElementById('profileExpiry').textContent = formatDate(c.expiryDate);
        document.getElementById('profileAmount').textContent = formatCurrency(c.amount || c.plan?.price);
        document.getElementById('profileId').textContent = c.id;
        document.getElementById('profileCreatedAt').textContent = formatDate(c.createdAt);
        
        const isDeactivated = c.status === 'INACTIVE';
        deactivateBtn.disabled = isDeactivated;
        deactivateBtn.innerHTML = isDeactivated ? '<i class="fas fa-user-slash"></i> Already Deactivated' : '<i class="fas fa-user-slash"></i> Deactivate Customer';
    }

    // ============================================================
    // MODAL SYSTEM
    // ============================================================
    function openModal(titleText, bodyHtml, footerHtml) {
        modalBox.innerHTML = `<div class="modal-header"><h3>${titleText}</h3><button type="button" class="modal-close-btn" id="modalCloseBtn"><i class="fas fa-times"></i></button></div><div class="modal-body">${bodyHtml}</div>${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}`;
        modalOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    }
    function closeModal() { modalOverlay.classList.remove('open'); document.body.style.overflow = ''; modalBox.innerHTML = ''; }
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal(); });

    function planOptionsHtml(selectedPlanId) {
        return allPlans.map(p => `<option value="${p.id}" ${p.id === selectedPlanId ? 'selected' : ''}>${p.name} (${formatCurrency(p.price)})</option>`).join('');
    }

    // ============================================================
    // ACTIONS (ADD, EXTEND, CHANGE PLAN, DEACTIVATE)
    // ============================================================
    function openAddCustomerModal() {
        const todayIso = new Date().toISOString().slice(0, 10);
        const body = `
            <div class="form-field" id="addNameField"><label>Customer Name</label><input type="text" id="addCustomerName" /><div class="field-error">Please enter a name.</div></div>
            <div class="form-field"><label>Plan</label><select id="addCustomerPlan">${planOptionsHtml(allPlans[0]?.id)}</select></div>
            <div class="form-field" id="addExpiryField"><label>Expiry Date</label><input type="date" id="addCustomerExpiry" min="${todayIso}" /><div class="field-error">Choose a valid date.</div></div>`;
        openModal('Add Customer', body, `<button type="button" class="btn-secondary" id="cancelAdd">Cancel</button><button type="button" class="btn-primary" id="confirmAdd"><i class="fas fa-check"></i> Add Customer</button>`);
        
        document.getElementById('cancelAdd').onclick = closeModal;
        document.getElementById('confirmAdd').onclick = async () => {
            const name = document.getElementById('addCustomerName').value.trim();
            const planId = document.getElementById('addCustomerPlan').value;
            const expiryDate = document.getElementById('addCustomerExpiry').value;
                       if (!name || !expiryDate) return alert('Please fill all fields');
            if (!planId) return alert('No plans available! Please create a plan in Prisma Studio first.');
            
            const res = await fetch(`${API}/customers`, { method: 'POST', headers: getHeaders(), body: JSON.stringify({ name, planId, expiryDate }) });
            if (res.ok) {
                const newC = await res.json();
                allCustomers.unshift(newC);
                closeModal(); clearFilters();
            } else { alert((await res.json()).error || 'Failed to add'); }
        };
    }

    function openExtendServiceModal(id) {
        const c = allCustomers.find(x => x.id === id);
        if (!c) return;
        const body = `
            <p style="margin-bottom:14px;">Current expiry: <strong>${formatDate(c.expiryDate)}</strong></p>
            <div class="quick-chips">
                <button type="button" class="quick-chip" data-months="1">+1 Month</button>
                <button type="button" class="quick-chip" data-months="3">+3 Months</button>
                <button type="button" class="quick-chip" data-months="6">+6 Months</button>
                <button type="button" class="quick-chip" data-months="12">+12 Months</button>
            </div>
            <div class="form-field" id="extendDateField"><label>New Expiry Date</label><input type="date" id="extendExpiryInput" value="${c.expiryDate.slice(0,10)}" /></div>`;
        openModal('Extend Service', body, `<button type="button" class="btn-secondary" id="cancelExtend">Cancel</button><button type="button" class="btn-primary" id="confirmExtend"><i class="fas fa-check"></i> Extend</button>`);
        
        const dateInput = document.getElementById('extendExpiryInput');
        document.querySelectorAll('.quick-chip').forEach(chip => {
            chip.onclick = () => {
                const d = new Date(dateInput.value || Date.now());
                d.setMonth(d.getMonth() + parseInt(chip.dataset.months));
                dateInput.value = d.toISOString().slice(0, 10);
            };
        });
        
        document.getElementById('cancelExtend').onclick = closeModal;
        document.getElementById('confirmExtend').onclick = async () => {
            const res = await fetch(`${API}/customers/${id}/extend`, { method: 'POST', headers: getHeaders(), body: JSON.stringify({ newExpiryDate: dateInput.value }) });
            if (res.ok) {
                const data = await res.json();
                const updated = data.customer || data;
                const idx = allCustomers.findIndex(x => x.id === id);
                if (idx !== -1) allCustomers[idx] = updated;
                closeModal();
                if (state.currentProfileId === id) renderProfile(updated);
                renderCustomerList();
            } else { alert((await res.json()).error || 'Failed'); }
        };
    }

    function openChangePlanModal(id) {
        const c = allCustomers.find(x => x.id === id);
        if (!c) return;
        const body = `<div class="form-field"><label>New Plan</label><select id="changePlanSelect">${planOptionsHtml(c.planId)}</select></div>`;
        openModal('Change Plan', body, `<button type="button" class="btn-secondary" id="cancelChange">Cancel</button><button type="button" class="btn-primary" id="confirmChange"><i class="fas fa-check"></i> Change Plan</button>`);
        
        document.getElementById('cancelChange').onclick = closeModal;
        document.getElementById('confirmChange').onclick = async () => {
            const planId = document.getElementById('changePlanSelect').value;
            const res = await fetch(`${API}/customers/${id}/change-plan`, { method: 'POST', headers: getHeaders(), body: JSON.stringify({ planId }) });
            if (res.ok) {
                const data = await res.json();
                const updated = data.customer || data;
                const idx = allCustomers.findIndex(x => x.id === id);
                if (idx !== -1) allCustomers[idx] = updated;
                closeModal();
                if (state.currentProfileId === id) renderProfile(updated);
                renderCustomerList();
            } else { alert((await res.json()).error || 'Failed'); }
        };
    }

    function openDeactivateConfirm(id) {
        const c = allCustomers.find(x => x.id === id);
        if (!c) return;
        openModal('Deactivate Customer', `<div class="confirm-icon"><i class="fas fa-user-slash"></i></div><p>Are you sure you want to deactivate <strong>${escapeHtml(c.name)}</strong>?</p>`, 
            `<button type="button" class="btn-secondary" id="cancelDeact">Cancel</button><button type="button" class="btn-danger" id="confirmDeact"><i class="fas fa-user-slash"></i> Deactivate</button>`);
        
        document.getElementById('cancelDeact').onclick = closeModal;
        document.getElementById('confirmDeact').onclick = async () => {
            const res = await fetch(`${API}/customers/${id}/deactivate`, { method: 'POST', headers: getHeaders() });
            if (res.ok) {
                const data = await res.json();
                const updated = data.customer || data;
                const idx = allCustomers.findIndex(x => x.id === id);
                if (idx !== -1) allCustomers[idx] = updated;
                closeModal();
                if (state.currentProfileId === id) renderProfile(updated);
                renderCustomerList();
            } else { alert((await res.json()).error || 'Failed'); }
        };
    }

    // ============================================================
    // EVENT WIRING
    // ============================================================
    addCustomerBtn.addEventListener('click', openAddCustomerModal);
    let searchTimer;
    customerSearchInput.addEventListener('input', function() { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.search = this.value; state.page = 1; renderCustomerList(); }, 150); });
    planFilterEl.addEventListener('change', function() { state.plan = this.value; state.page = 1; renderCustomerList(); });
    statusFilterEl.addEventListener('change', function() { state.status = this.value; state.page = 1; renderCustomerList(); });

    customerTableBody.addEventListener('click', function(e) {
        if (e.target.closest('.extend-btn')) return openExtendServiceModal(e.target.closest('.extend-btn').dataset.id);
        if (e.target.closest('.change-plan-btn')) return openChangePlanModal(e.target.closest('.change-plan-btn').dataset.id);
        const row = e.target.closest('tr[data-id]');
        if (row) showCustomerProfileView(row.dataset.id);
    });

    paginationControls.addEventListener('click', function(e) {
        const btn = e.target.closest('.page-btn');
        if (btn && !btn.disabled) { state.page = parseInt(btn.dataset.page); renderCustomerList(); window.scrollTo({top:0, behavior:'smooth'}); }
    });

    backToCustomersBtn.addEventListener('click', () => { showCustomerListView(); renderCustomerList(); });
    deactivateBtn.addEventListener('click', () => { if (state.currentProfileId) openDeactivateConfirm(state.currentProfileId); });
    profileExtendBtn.addEventListener('click', () => { if (state.currentProfileId) openExtendServiceModal(state.currentProfileId); });
    profileChangePlanBtn.addEventListener('click', () => { if (state.currentProfileId) openChangePlanModal(state.currentProfileId); });

    // ============================================================
    // SIDEBAR & THEME (Shared UI)
    // ============================================================
    const sidebar = document.getElementById('sidebar'), sidebarOverlay = document.getElementById('sidebarOverlay'), hamburgerBtn = document.getElementById('hamburgerBtn'), closeSidebarBtn = document.getElementById('closeSidebarBtn');
    function openSidebar() { sidebar.classList.add('open'); sidebarOverlay.classList.add('open'); hamburgerBtn.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); hamburgerBtn.classList.remove('open'); document.body.style.overflow = ''; }
    hamburgerBtn.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
    closeSidebarBtn.addEventListener('click', closeSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar(); });

    const themeToggle = document.getElementById('themeToggle'), themeIcon = document.getElementById('themeIcon');
    let darkMode = false;
    function applyTheme(isDark) {
        darkMode = isDark;
        if (isDark) { document.documentElement.setAttribute('data-theme', 'dark'); themeIcon.className = 'fas fa-sun'; }
        else { document.documentElement.removeAttribute('data-theme'); themeIcon.className = 'fas fa-moon'; }
        try { localStorage.setItem('prontox-theme', isDark ? 'dark' : 'light'); } catch (_) {}
    }
    try { const saved = localStorage.getItem('prontox-theme'); if (saved === 'dark') applyTheme(true); else if (window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme(true); else applyTheme(false); } catch (_) { applyTheme(false); }
    themeToggle.addEventListener('click', () => applyTheme(!darkMode));

    const logoLink = document.getElementById('logoLink');
    if (logoLink) logoLink.addEventListener('click', e => { e.preventDefault(); window.location.href = 'dashboard.html'; });
    document.getElementById('avatarBtn').addEventListener('click', () => alert('👤 User profile – would open user settings.'));
    
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) logoutBtn.addEventListener('click', e => {
        e.preventDefault();
        if (confirm('Are you sure you want to log out?')) {
            localStorage.removeItem('prontolog_token');
            localStorage.removeItem('prontolog_user_id');
            window.location.href = 'login.html';
        }
    });

    // ============================================================
    // INIT
    // ============================================================
    loadInitialData();
    console.log('✅ Customer page connected to live API.');
})();
</script>

</body>
</html>
