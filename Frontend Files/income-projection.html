<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prontox · Income Projection</title>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ============================================================
           PRONTOX COLOR PALETTE & FONTS
           ============================================================ */
        :root {
            --bg: #F0F4F8;
            --surface: #FFFFFF;
            --surface-2: #F8FAFC;
            --surface-3: #F1F5F9;
            --text-primary: #1A2332;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --accent: #00AFEF;
            --accent-hover: #0099D3;
            --accent-dark: #0088CC;
            --accent-light: #E6F6FE;
            --accent-mid: #B3E5FC;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-light: #fee2e2;
            --success: #10b981;
            --success-light: #d1fae5;

            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.08);
            --shadow-sidebar: 4px 0 30px rgba(0, 0, 0, 0.08);

            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-height: 68px;
        }

        [data-theme="dark"] {
            --bg: #0E0F11;
            --surface: #1A1E21;
            --surface-2: #24292E;
            --surface-3: #2D3338;
            --text-primary: #E7E9EB;
            --text-secondary: #AAB0B6;
            --text-muted: #888E99;
            --border: #353E46;
            --accent: #60A5FA;
            --accent-hover: #3B82F6;
            --accent-dark: #2563EB;
            --accent-light: #1a3a5a;
            --accent-mid: #2a4a6a;
            --danger: #f87171;
            --danger-hover: #ef4444;
            --danger-light: #4a1a1a;
            --success: #34d399;
            --success-light: #0a3a2a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.5);
            --shadow-sidebar: 4px 0 30px rgba(0, 0, 0, 0.6);
        }

        /* --- RESET & BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background var(--transition), color var(--transition);
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        input,
        select {
            font-family: inherit;
            outline: none;
        }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            height: var(--nav-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background var(--transition), border-color var(--transition);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
            transition: color var(--transition);
        }
        .nav-logo .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            transition: background var(--transition);
        }
        .nav-logo span {
            color: var(--accent);
            transition: color var(--transition);
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 6px;
            border-radius: var(--radius-xs);
            transition: background 0.2s;
        }
        .hamburger:hover {
            background: var(--surface-2);
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: var(--text-primary);
            border-radius: 4px;
            transition: all 0.25s ease;
            transform-origin: center;
        }
        .hamburger.open span:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }
        .hamburger.open span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .hamburger.open span:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-right .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1rem;
            transition: all 0.2s;
            background: transparent;
        }
        .nav-right .icon-btn:hover {
            background: var(--surface-2);
            color: var(--text-primary);
        }
        .nav-right .avatar {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: var(--accent-light);
            color: var(--accent-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .nav-right .avatar:hover {
            border-color: var(--accent);
        }

        /* ============================================================
           SIDEBAR (grouped)
           ============================================================ */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background var(--transition), border-color var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sidebar);
            overflow-y: auto;
        }
        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-header .close-sidebar {
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: background 0.2s, color 0.2s;
        }
        .sidebar-header .close-sidebar:hover {
            background: var(--surface-2);
            color: var(--text-primary);
        }

        .sidebar-nav {
            padding: 16px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav .nav-group {
            margin-bottom: 6px;
        }
        .sidebar-nav .nav-group:last-child {
            margin-bottom: 0;
        }

        .sidebar-nav .nav-group-label {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 8px 16px 4px 16px;
            user-select: none;
            transition: color var(--transition);
        }

        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: var(--radius-xs);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .sidebar-nav .nav-item i {
            width: 20px;
            font-size: 1rem;
            color: var(--text-muted);
            transition: color 0.15s;
        }
        .sidebar-nav .nav-item:hover {
            background: var(--surface-2);
            color: var(--text-primary);
        }
        .sidebar-nav .nav-item:hover i {
            color: var(--accent);
        }
        .sidebar-nav .nav-item.active {
            background: var(--accent-light);
            color: var(--accent-dark);
            border-left-color: var(--accent);
            font-weight: 600;
        }
        .sidebar-nav .nav-item.active i {
            color: var(--accent);
        }

        .sidebar-nav .nav-item.logout {
            color: var(--danger);
            padding-top: 10px;
        }
        .sidebar-nav .nav-item.logout i {
            color: var(--danger);
        }
        .sidebar-nav .nav-item.logout:hover {
            background: var(--danger-light);
            color: var(--danger-hover);
        }
        .sidebar-nav .nav-item.logout:hover i {
            color: var(--danger-hover);
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            flex: 1;
            padding: 30px 28px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            transition: padding 0.3s;
        }

        .page-header {
            margin-bottom: 28px;
        }
        .page-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            transition: color var(--transition);
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
            transition: color var(--transition);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── NAVBAR ─── -->
    <header class="navbar">
        <div class="nav-left">
            <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <div class="nav-right">
            <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            <div class="avatar" id="avatarBtn" tabindex="0">JD</div>
        </div>
    </header>

    <!-- ─── SIDEBAR OVERLAY ─── -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ─── SIDEBAR ─── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span style="font-weight:700;color:var(--text-primary);">Menu</span>
            <button class="close-sidebar" id="closeSidebarBtn"><i class="fas fa-times"></i></button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group">
                <div class="nav-group-label">MAIN</div>
                <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="customer.html" class="nav-item"><i class="fas fa-user-friends"></i> Customers</a>
                <a href="income-projection.html" class="nav-item active"><i class="fas fa-chart-line"></i> Income Projection</a>
                <a href="payments.html" class="nav-item"><i class="fas fa-credit-card"></i> Payments</a>
            </div>
            <div class="nav-group">
                <div class="nav-group-label">REPORTS</div>
                <a href="monthly-income.html" class="nav-item"><i class="fas fa-calendar-alt"></i> Monthly Income</a>

        </nav>
    </aside>

    <!-- ─── MAIN CONTENT ─── -->
    <main class="main-content" id="mainContent">

        <div class="page-header">
            <h2>Income Projection</h2>
            <p>View projected income for each plan across different timeframes, computed automatically from your customers.</p>
        </div>

    </main>

    <!-- ─── JAVASCRIPT ─── -->
    <script>
(function () {
  'use strict';

  const API = 'http://172.23.63.10:5001/api';
  const $ = (id) => document.getElementById(id);

  /* SAME identity as your other working pages */
  const headers = () => {
    const h = { 'Content-Type': 'application/json' };
    const token = localStorage.getItem('prontolog_token');
    if (token) h['Authorization'] = 'Bearer ' + token;
    h['x-user-id'] = localStorage.getItem('prontolog_user_id') || 'af606104-2914-4b9c-9c1d-c3a103642103';
    return h;
  };

  const fmt = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');
  const td = 'padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-primary);';
  const tdr = td + 'text-align:right;';
  const th = 'padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);border-bottom:1px solid var(--border);';
  const sod = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());

  /* ============================================================
     1) INJECT LIVE AUTO SECTION (with full plan filter)
  ============================================================ */
  const main = document.querySelector('main') || document.body;
  const headerEl = document.querySelector('.page-header');
  const autoWrap = document.createElement('section');
  autoWrap.style.cssText = 'background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:22px;box-shadow:var(--shadow);';
  autoWrap.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
      <h2 style="font-size:16px;font-weight:600;color:var(--text-primary);">📡 Live Projection (Auto-Computed)</h2>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span id="autoTransparency" style="font-size:12px;color:var(--text-muted);"></span>
        <select id="autoPlanFilter" style="background:var(--surface-2);border:1px solid var(--border);color:var(--text-primary);padding:7px 10px;border-radius:8px;font-size:13px;"></select>
      </div>
    </div>
    <div id="autoCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px;"></div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr>
          <th style="${th}text-align:left;">Service Plan</th>
          <th style="${th}text-align:right;">Billable Customers</th>
          <th style="${th}text-align:right;">Price</th>
          <th style="${th}text-align:right;">3-Day</th>
          <th style="${th}text-align:right;">1-Week</th>
          <th style="${th}text-align:right;">1-Month ⭐</th>
          <th style="${th}text-align:right;">1-Year</th>
        </tr></thead>
        <tbody id="ppBody"></tbody>
      </table>
    </div>`;
  if (headerEl) headerEl.parentNode.insertBefore(autoWrap, headerEl.nextSibling);
  else main.prepend(autoWrap);

  /* ============================================================
     2) AUTO DATA — server first, browser fallback (never empty)
  ============================================================ */
  let AUTO = null;

  async function fetchPlans() {
    try {
      const r = await fetch(API + '/customers/plans', { headers: headers() });
      const d = await r.json();
      return Array.isArray(d) ? d : (d.plans || []);
    } catch (e) { return []; }
  }

  async function computeLocalAuto(plans) {
    let customers = [];
    try {
      const r = await fetch(API + '/customers', { headers: headers() });
      const d = await r.json();
      customers = Array.isArray(d) ? d : (d.customers || []);
    } catch (e) {}

    const now = new Date(), today = sod(now);
    const in3 = new Date(today.getTime() + 3 * 86400000);
    const in7 = new Date(today.getTime() + 7 * 86400000);

    const rows = plans.map(pl => {
      const price = Number(pl.price) || 0;
      const mine = customers.filter(c => c.planId === pl.id);
      const billable = mine.filter(c => {
        const st = String(c.displayStatus || c.status || '').toUpperCase();
        return st === 'ACTIVE' || st === 'EXPIRED';
      }).length;
      let f3 = 0, f7 = 0;
      mine.forEach(c => {
        const exp = new Date(c.expiryDate);
        if (exp >= today && exp <= in3) f3 += price;
        if (exp >= today && exp <= in7) f7 += price;
      });
      return {
        planId: pl.id, planName: pl.name, price,
        billableCustomers: billable, source: 'auto',
        threeDay: f3, oneWeek: f7,
        oneMonth: billable * price, oneYear: billable * price * 12
      };
    });

    const totals = rows.reduce((t, p) => ({
      threeDay: t.threeDay + p.threeDay, oneWeek: t.oneWeek + p.oneWeek,
      oneMonth: t.oneMonth + p.oneMonth, oneYear: t.oneYear + p.oneYear
    }), { threeDay: 0, oneWeek: 0, oneMonth: 0, oneYear: 0 });

    const st = (c) => String(c.displayStatus || c.status || '').toUpperCase();
    return {
      perPlan: rows, totals,
      counts: {
        billable: customers.filter(c => st(c) === 'ACTIVE' || st(c) === 'EXPIRED').length,
        active: customers.filter(c => st(c) === 'ACTIVE').length,
        expired: customers.filter(c => st(c) === 'EXPIRED').length
      },
      manualCount: 0
    };
  }

  async function loadAuto() {
    const plans = await fetchPlans();
    let d = null;

    try {
      const res = await fetch(API + '/projections/auto', { headers: headers() });
      if (res.ok) {
        const data = await res.json();
        if (data && data.perPlan && data.perPlan.length) d = data;
      }
    } catch (e) {}

    if (!d) d = await computeLocalAuto(plans);

    /* Make sure EVERY plan appears (even with 0 customers) */
    plans.forEach(pl => {
      if (!d.perPlan.some(p => p.planId === pl.id)) {
        d.perPlan.push({
          planId: pl.id, planName: pl.name, price: Number(pl.price) || 0,
          billableCustomers: 0, source: 'auto',
          threeDay: 0, oneWeek: 0, oneMonth: 0, oneYear: 0
        });
      }
    });

    AUTO = d;

    const sel = $('autoPlanFilter');
    sel.innerHTML = '<option value="all">All Plans (combined)</option>' +
      plans.map(p => '<option value="' + p.id + '">' + p.name + '</option>').join('');
    sel.onchange = renderAuto;

    renderAuto();
  }

  function renderAuto() {
    if (!AUTO) return;
    const filter = $('autoPlanFilter') ? $('autoPlanFilter').value : 'all';
    const rows = filter === 'all' ? AUTO.perPlan : AUTO.perPlan.filter(p => p.planId === filter);

    $('autoTransparency').textContent =
      'Computed from ' + AUTO.counts.billable + ' billable customers (' + AUTO.counts.active + ' Active + ' + AUTO.counts.expired + ' Expired)';

    const t = rows.reduce((s, p) => ({
      b: s.b + p.billableCustomers, d3: s.d3 + p.threeDay, w: s.w + p.oneWeek, m: s.m + p.oneMonth, y: s.y + p.oneYear
    }), { b: 0, d3: 0, w: 0, m: 0, y: 0 });

    const cards = [
      { label: '3-Day Projection', v: t.d3 },
      { label: '1-Week Projection', v: t.w },
      { label: '1-Month Projection ⭐', v: t.m, star: true },
      { label: '1-Year Projection', v: t.y }
    ];
    $('autoCards').innerHTML = cards.map(c => `
      <div style="background:var(--surface-2);border:1px solid ${c.star ? 'var(--accent)' : 'var(--border)'};border-radius:10px;padding:14px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600;">${c.label}</div>
        <div style="font-size:22px;font-weight:700;color:${c.star ? 'var(--accent)' : 'var(--text-primary)'};margin-top:6px;">${fmt(c.v)}</div>
      </div>`).join('');

    $('ppBody').innerHTML = rows.map(p => `
      <tr>
        <td style="${td}"><strong>${p.planName}</strong></td>
        <td style="${tdr}">${p.billableCustomers}</td>
        <td style="${tdr}">${fmt(p.price)}</td>
        <td style="${tdr}">${fmt(p.threeDay)}</td>
        <td style="${tdr}">${fmt(p.oneWeek)}</td>
        <td style="${tdr}"><strong>${fmt(p.oneMonth)}</strong></td>
        <td style="${tdr}">${fmt(p.oneYear)}</td>
      </tr>`).join('') + `
      <tr>
        <td style="${td}"><strong style="color:var(--accent);">TOTAL${filter !== 'all' ? ' (this plan)' : ' (all plans)'}</strong></td>
        <td style="${tdr}"><strong>${t.b}</strong></td>
        <td style="${tdr}">—</td>
        <td style="${tdr}"><strong>${fmt(t.d3)}</strong></td>
        <td style="${tdr}"><strong>${fmt(t.w)}</strong></td>
        <td style="${tdr}"><strong style="color:var(--accent);">${fmt(t.m)}</strong></td>
        <td style="${tdr}"><strong>${fmt(t.y)}</strong></td>
      </tr>`;
  }

  /* ============================================================
     3) SHARED UI
  ============================================================ */
  const sidebar = $('sidebar'), overlay = $('sidebarOverlay'), hamburger = $('hamburgerBtn'), closeSidebarBtn = $('closeSidebarBtn');
  function openSidebar() { if (!sidebar) return; sidebar.classList.add('open'); overlay && overlay.classList.add('open'); hamburger && hamburger.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeSidebar() { if (!sidebar) return; sidebar.classList.remove('open'); overlay && overlay.classList.remove('open'); hamburger && hamburger.classList.remove('open'); document.body.style.overflow = ''; }
  hamburger && hamburger.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
  closeSidebarBtn && closeSidebarBtn.addEventListener('click', closeSidebar);
  overlay && overlay.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sidebar && sidebar.classList.contains('open')) closeSidebar(); });

  const themeToggle = $('themeToggle'), themeIcon = $('themeIcon');
  let darkMode = false;
  function applyTheme(isDark) {
    darkMode = isDark;
    if (isDark) { document.documentElement.setAttribute('data-theme', 'dark'); if (themeIcon) themeIcon.className = 'fas fa-sun'; }
    else { document.documentElement.removeAttribute('data-theme'); if (themeIcon) themeIcon.className = 'fas fa-moon'; }
    try { localStorage.setItem('prontox-theme', isDark ? 'dark' : 'light'); } catch (_) {}
  }
  try {
    const savedTheme = localStorage.getItem('prontox-theme');
    if (savedTheme === 'dark') applyTheme(true);
    else if (savedTheme === 'light') applyTheme(false);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme(true);
    else applyTheme(false);
  } catch (_) { applyTheme(false); }
  themeToggle && themeToggle.addEventListener('click', () => applyTheme(!darkMode));

  const logoutBtn = $('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', e => {
    e.preventDefault();
    if (confirm('Are you sure you want to log out?')) {
      localStorage.removeItem('prontolog_token');
      localStorage.removeItem('prontolog_user_id');
      window.location.href = 'login.html';
    }
  });

  loadAuto();
  console.log('✅ Income Projection: Live Auto-Computed only.');
})();
</script>
<script src="admin-link.js"></script>
</body>
