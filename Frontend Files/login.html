      const IconUser = ({ size = 16, className = "" }) => (

      const IconCheck = ({ size = 16, className = "" }) => (

      const IconCheckCircle = ({ size = 16, className = "" }) => (

          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>

      const IconBuilding = ({ size = 16, className = "" }) => (

          <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>

          <line x1="8" y1="6" x2="8.01" y2="6"></line>

      const IconTrendingUp = ({ size = 16, className = "" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
      );

      // Circular Logo Badge
      const LogoBadge = ({ size = 'md' }) => {
        const dimensions = size === 'sm' ? 'w-10 h-10' : 'w-14 h-14';
        const iconSize = size === 'sm' ? 20 : 28;
        return (
          <div className="inline-flex flex-col items-center justify-center">
            <div className="p-[3px] rounded-full bg-gradient-to-tr from-[#00AFEF] via-[#B3E5FC] to-[#0088CC] shadow-logo-badge hover:scale-105 transition-transform duration-300">
              <div className={`${dimensions} rounded-full bg-white flex items-center justify-center border border-[#E2E8F0] relative group`}>
                <div className="absolute inset-0 rounded-full bg-[#E6F6FE] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <IconLandmark size={iconSize} className="text-[#00AFEF] relative z-10" />
                <div className="absolute -bottom-1 -right-1 bg-[#00AFEF] text-white p-0.5 rounded-full border-2 border-white shadow-sm">
                  <IconShieldCheck size={size === 'sm' ? 10 : 12} />
                </div>
              </div>
            </div>

      };

      // Left Column Accounting Artwork Illustration
      const LeftIllustration = () => (
        <div className="relative w-full h-full min-h-[460px] lg:min-h-[600px] bg-gradient-to-br from-[#F8FAFC] via-[#E6F6FE] to-[#F0F4F8] rounded-[14px] p-6 lg:p-8 flex flex-col justify-between border border-[#E2E8F0] shadow-auth-subtle overflow-hidden">
          <div className="absolute -top-20 -left-20 w-72 h-72 bg-[#B3E5FC]/40 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute -bottom-20 -right-20 w-80 h-80 bg-[#00AFEF]/15 rounded-full blur-3xl pointer-events-none"></div>

          <div className="relative z-10 flex items-center justify-between">
            <div className="flex items-center space-x-2 bg-white/90 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-[#E2E8F0] shadow-sm">
              <IconBuilding size={16} className="text-[#00AFEF]" />
              <span className="text-xs font-semibold text-[#1A2332]">Apex Accounting Suite</span>
            </div>
            <div className="flex items-center space-x-1.5 bg-[#E6F6FE] px-3 py-1 rounded-full border border-[#B3E5FC]">
              <IconShieldCheck size={14} className="text-[#0088CC]" />
              <span className="text-[11px] font-medium text-[#0088CC]">SOC-2 & ISO 27001 Certified</span>
            </div>
          </div>

          <div className="relative z-10 my-auto py-6 flex flex-col items-center">
            {/* Vector Financial Art Graphic */}
            <div className="relative w-full max-w-sm mx-auto bg-white p-5 rounded-[14px] border border-[#E2E8F0] shadow-auth-card space-y-4">
              <div className="flex items-center justify-between border-b border-[#E2E8F0] pb-3">
                <div className="flex items-center space-x-2">
                  <div className="w-3 h-3 rounded-full bg-[#00AFEF]"></div>
                  <span className="text-xs font-bold text-[#1A2332]">Corporate General Ledger</span>
                </div>
                <span className="text-[10px] text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded font-semibold">Live Audit Sync</span>
              </div>

              {/* Chart Bar Graphic */}
              <div className="flex items-end justify-between h-32 pt-4 px-2 space-x-2 border-b border-[#E2E8F0] pb-2">
                <div className="w-1/6 bg-[#B3E5FC] rounded-t h-1/2"></div>
                <div className="w-1/6 bg-[#00AFEF] rounded-t h-3/4"></div>
                <div className="w-1/6 bg-[#0088CC] rounded-t h-2/3"></div>
                <div className="w-1/6 bg-[#B3E5FC] rounded-t h-4/5"></div>
                <div className="w-1/6 bg-[#00AFEF] rounded-t h-full"></div>
                <div className="w-1/6 bg-[#0088CC] rounded-t h-5/6"></div>
              </div>

              <div className="flex items-center justify-between text-xs pt-1">
                <span className="text-[#475569] font-medium">Reconciled Assets</span>
                <span className="font-bold text-[#1A2332]">$14,850,290.00</span>
              </div>
            </div>

            <div className="mt-6 text-center max-w-md">
              <h2 className="text-xl lg:text-2xl font-normal text-[#1A2332] font-garamond italic">
                "Precision financial controls designed for modern enterprise teams."
              </h2>
              <p className="mt-2 text-xs text-[#475569] leading-relaxed">
                Automated reconciliations, real-time balance sheets, and bank-grade security.
              </p>
            </div>
          </div>

          <div className="relative z-10 pt-3 border-t border-[#E2E8F0] flex items-center justify-between text-xs text-[#94A3B8]">
            <span className="flex items-center gap-1">
              <IconLock size={12} className="text-[#00AFEF]" /> Enterprise Single Sign-On
            </span>
            <span className="text-[#475569] font-medium">Trusted by 5,000+ Finance Leaders</span>
          </div>
        </div>
      );

      // Left-side Landing Page
      const LandingPage = () => (
        <section className="relative w-full min-h-[520px] lg:min-h-[680px] overflow-hidden rounded-[22px] bg-gradient-to-br from-[#071B2B] via-[#08324A] to-[#006A9A] p-7 sm:p-9 lg:p-10 text-white shadow-auth-card">
          <div className="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-[#00AFEF]/20 blur-3xl"></div>
          <div className="absolute -bottom-32 -left-20 w-80 h-80 rounded-full bg-[#00AFEF]/15 blur-3xl"></div>
          <div className="relative z-10 flex h-full flex-col justify-between">
            <div>
              <div className="flex items-center gap-3 mb-10">
                <div className="w-11 h-11 rounded-xl bg-white/10 border border-white/20 flex items-center justify-center backdrop-blur-sm">
                  <IconLandmark size={23} className="text-[#63D7FF]" />
                </div>
                <div>
                  <div className="text-lg font-bold tracking-tight">ProntoLog</div>
                  <div className="text-[10px] uppercase tracking-[0.2em] text-white/55">ISP Finance Platform</div>
                </div>
              </div>
              <div className="max-w-xl">
                <div className="inline-flex items-center gap-2 rounded-full border border-[#63D7FF]/25 bg-white/10 px-3 py-1.5 text-[10px] font-semibold uppercase tracking-wider text-[#B9ECFF]">
                  <span className="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                  Built for Internet Service Providers
                </div>
                <h2 className="mt-5 text-4xl sm:text-5xl lg:text-[3.35rem] leading-[1.02] font-semibold tracking-tight">Know where your ISP money is going.</h2>
                <p className="mt-5 max-w-lg text-sm sm:text-base leading-7 text-white/70">ProntoLog brings subscriber revenue, billing, expenses, reconciliations and financial reporting into one clear workspace for modern ISP teams.</p>
              </div>
              <div className="mt-8 grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-2xl">
                <div className="rounded-2xl border border-white/10 bg-white/[0.07] p-4 backdrop-blur-sm"><div className="text-lg font-semibold">Revenue</div><div className="mt-1 text-[11px] text-white/55">Track collections & subscriptions</div></div>
                <div className="rounded-2xl border border-white/10 bg-white/[0.07] p-4 backdrop-blur-sm"><div className="text-lg font-semibold">Control</div><div className="mt-1 text-[11px] text-white/55">Monitor costs & cash movement</div></div>
                <div className="rounded-2xl border border-white/10 bg-white/[0.07] p-4 backdrop-blur-sm"><div className="text-lg font-semibold">Insight</div><div className="mt-1 text-[11px] text-white/55">Make faster finance decisions</div></div>
              </div>
            </div>
            <div className="mt-10 rounded-2xl border border-white/10 bg-black/10 p-5 backdrop-blur-sm">
              <div className="flex items-center justify-between mb-4"><div><div className="text-[10px] uppercase tracking-wider text-white/45">Monthly ISP Revenue</div><div className="mt-1 text-2xl font-semibold">₦48.6M</div></div><div className="rounded-full bg-emerald-400/10 px-2.5 py-1 text-[10px] font-semibold text-emerald-300">+14.8%</div></div>
              <div className="flex items-end gap-1.5 h-14">
                <div className="w-full rounded-t bg-white/15 h-[35%]"></div><div className="w-full rounded-t bg-white/20 h-[48%]"></div><div className="w-full rounded-t bg-white/25 h-[42%]"></div><div className="w-full rounded-t bg-[#63D7FF]/55 h-[64%]"></div><div className="w-full rounded-t bg-[#63D7FF]/70 h-[58%]"></div><div className="w-full rounded-t bg-[#63D7FF] h-[86%]"></div><div className="w-full rounded-t bg-[#8DE5FF] h-full"></div>
              </div>
            </div>
          </div>
        </section>
      );

      // Login Form Component
      const LoginForm = ({ onNavigateSignUp, onNavigateForgot, onLoginSuccess }) => {
        const [email, setEmail] = useState('controller@enterprise-accounting.com');
        const [password, setPassword] = useState('Password123!');
        const [showPassword, setShowPassword] = useState(false);
        const [rememberMe, setRememberMe] = useState(true);
        const [isLoading, setIsLoading] = useState(false);
        const [error, setError] = useState('');

        const handleSubmit = (e) => {
          e.preventDefault();
          setError('');

          if (!email || !email.includes('@')) {
            setError('Please enter a valid work email address.');
            return;
          }
          if (!password || password.length < 6) {
            setError('Password must be at least 6 characters.');
            return;
          }

          setIsLoading(true);
          setTimeout(() => {
            setIsLoading(false);
            onLoginSuccess(email);
          }, 1000);
        };

        return (
          <div className="w-full max-w-md mx-auto py-2">
            <div className="flex justify-center mb-5">
              <LogoBadge size="md" />
            </div>

            <div className="text-center mb-6">
              <h1 className="text-3xl font-normal text-[#1A2332] font-garamond tracking-tight">
                Welcome Back!
              </h1>
              <p className="mt-1.5 text-xs sm:text-sm text-[#475569]">
                Sign in to access your enterprise financial ledger and reports.
              </p>
            </div>

            {error && (
              <div className="mb-4 p-3 rounded-[10px] bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium animate-shake">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-[#1A2332] uppercase tracking-wider mb-1.5">
                  Email Address
                </label>
                <div className="relative rounded-[14px]">
                  <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#94A3B8]">
                    <IconMail size={16} />
                  </div>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="name@company.com"
                    className="w-full pl-10 pr-4 py-3 bg-white text-[#1A2332] text-sm rounded-[14px] border border-[#E2E8F0] placeholder-[#94A3B8] focus:outline-none focus:border-[#00AFEF] focus:ring-4 focus:ring-[#E6F6FE] transition-all"
                  />
                </div>
              </div>

              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="block text-xs font-semibold text-[#1A2332] uppercase tracking-wider">
                    Password
                  </label>
                  <button
                    type="button"
                    onClick={onNavigateForgot}
                    className="text-xs font-semibold text-[#0088CC] hover:text-[#00AFEF] hover:underline focus:outline-none"
                  >
                    Forgot Password?
                  </button>
                </div>
                <div className="relative rounded-[14px]">
                  <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#94A3B8]">
                    <IconLock size={16} />
                  </div>
                  <input
                    type={showPassword ? 'text' : 'password'}
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••••••"
                    className="w-full pl-10 pr-11 py-3 bg-white text-[#1A2332] text-sm rounded-[14px] border border-[#E2E8F0] placeholder-[#94A3B8] focus:outline-none focus:border-[#00AFEF] focus:ring-4 focus:ring-[#E6F6FE] transition-all"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-[#94A3B8] hover:text-[#475569] focus:outline-none"
                  >
                    {showPassword ? <IconEyeOff size={16} /> : <IconEye size={16} />}
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between pt-1">
                <label className="flex items-center space-x-2.5 cursor-pointer group">
                  <input
                    type="checkbox"
                    checked={rememberMe}
                    onChange={(e) => setRememberMe(e.target.checked)}
                    className="w-4 h-4 text-[#00AFEF] border-[#E2E8F0] rounded focus:ring-[#00AFEF]"
                  />
                  <span className="text-xs text-[#475569] font-medium group-hover:text-[#1A2332]">
                    Remember Me
                  </span>
                </label>
                <span className="text-[11px] text-[#94A3B8] flex items-center gap-1">
                  <IconShieldCheck size={12} className="text-[#00AFEF]" /> Encrypted
                </span>
              </div>

              <button
                type="submit"
                disabled={isLoading}
                className="w-full py-3.5 px-6 rounded-[14px] bg-[#00AFEF] hover:bg-[#0099D3] active:bg-[#0088CC] text-white text-sm font-semibold shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-[#B3E5FC] disabled:opacity-70 flex items-center justify-center space-x-2 transition-all cursor-pointer"
              >
                {isLoading ? (
                  <span>Authenticating Credentials...</span>
                ) : (
                  <>
                    <span>Log In to Workspace</span>
                    <IconArrowRight size={16} />
                  </>
                )}
              </button>
            </form>

            <div className="mt-8 pt-6 border-t border-[#E2E8F0] text-center">
              <p className="text-xs sm:text-sm text-[#475569]">
                Don't have an account?{' '}
                <button
                  type="button"
                  onClick={onNavigateSignUp}
                  className="font-semibold text-[#0088CC] hover:text-[#00AFEF] hover:underline focus:outline-none"
                >
                  Sign Up
                </button>
              </p>
            </div>
          </div>
        );
      };

      // Sign Up Form Component
      const SignUpForm = ({ onNavigateLogin, onOpenTerms, onSignUpSuccess }) => {
        const [firstName, setFirstName] = useState('');
        const [lastName, setLastName] = useState('');
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [confirmPassword, setConfirmPassword] = useState('');
        const [showPassword, setShowPassword] = useState(false);
        const [showConfirmPassword, setShowConfirmPassword] = useState(false);
        const [acceptedTerms, setAcceptedTerms] = useState(false);
        const [isLoading, setIsLoading] = useState(false);
        const [error, setError] = useState('');

        const passwordsMatch = confirmPassword.length > 0 && password === confirmPassword;

        const handleSubmit = (e) => {
          e.preventDefault();
          setError('');

          if (!firstName.trim() || !lastName.trim()) {
            setError('Please enter your first and last name.');
            return;
          }
          if (!email || !email.includes('@')) {
            setError('Please enter a valid work email address.');
            return;
          }
          if (password.length < 8) {
            setError('Password must be at least 8 characters long.');
            return;
          }
          if (!passwordsMatch) {
            setError('Passwords do not match.');
            return;
          }
          if (!acceptedTerms) {
            setError('You must accept the terms and conditions.');
            return;
          }

          setIsLoading(true);
          setTimeout(() => {
            setIsLoading(false);
            onSignUpSuccess(email, firstName, lastName);
          }, 1000);
        };

        return (
          <div className="w-full max-w-md mx-auto py-1">
            <div className="flex items-center justify-between mb-4">
              <button
                type="button"
                onClick={onNavigateLogin}
                className="inline-flex items-center space-x-1.5 text-xs font-semibold text-[#475569] hover:text-[#00AFEF] bg-[#F8FAFC] px-3 py-1.5 rounded-full border border-[#E2E8F0] transition-colors"
              >
                <IconArrowLeft size={14} />
                <span>Back to Login</span>
              </button>
            </div>

            <div className="flex justify-center mb-3">
              <LogoBadge size="sm" />
            </div>

            <div className="text-center mb-5">
              <h1 className="text-2xl sm:text-3xl font-normal text-[#1A2332] font-garamond tracking-tight">
                Create Account
              </h1>
            </div>

            {error && (
              <div className="mb-4 p-3 rounded-[10px] bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium animate-shake">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3.5">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-[#1A2332] uppercase tracking-wider mb-1">
                    First Name
                  </label>
                  <input
                    type="text"
                    required
                    value={firstName}
                    onChange={(e) => setFirstName(e.target.value)}
                    placeholder="Sarah"
                    className="w-full px-3 py-2.5 bg-white text-[#1A2332] text-xs rounded-[14px] border border-[#E2E8F0] placeholder-[#94A3B8] focus:outline-none focus:border-[#00AFEF] focus:ring-4 focus:ring-[#E6F6FE]"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-[#1A2332] uppercase tracking-wider mb-1">
                    Last Name
                  </label>
                  <input
                    type="text"
                    required
                    value={lastName}
                    onChange={(e) => setLastName(e.target.value)}
                    placeholder="Jenkins"
                    className="w-full px-3 py-2.5 bg-white text-[#1A2332] text-xs rounded-[14px] border border-[#E2E8F0] placeholder-[#94A3B8] focus:outline-none focus:border-[#00AFEF] focus:ring-4 focus:ring-[#E6F6FE]"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#1A2332] uppercase tracking-wider mb-1">
                  Work Email Address
                </label>
                <div className="relative rounded-[14px]">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#94A3B8]">
                    <IconMail size={14} />
                  </div>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="sarah.j@company.com"
                    className="w-full pl-9 pr-3 py-2.5 bg-white text-[#1A2332] text-xs rounded-[14px] border border-[#E2E8F0] placeholder-[#94A3B8] focus:outline-none focus:border-[#00AFEF] focus:ring-4 focus:ring-[#E6F6FE]"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#1A2332] uppercase tracking-wider mb-1">
                  Password
                </label>
                <div className="relative rounded-[14px]">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#94A3B8]">
                    <IconLock size={14} />
                  </div>
                  <input
                    type={showPassword ? 'text' : 'password'}
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="At least 8 characters"
                    className="w-full pl-9 pr-10 py-2.5 bg-white text-[#1A2332] text-xs rounded-[14px] border border-[#E2E8F0] placeholder-[#94A3B8] focus:outline-none focus:border-[#00AFEF] focus:ring-4 focus:ring-[#E6F6FE]"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute inset-y-0 right-0 pr-3 flex items-center text-[#94A3B8]"
                  >
                    {showPassword ? <IconEyeOff size={14} /> : <IconEye size={14} />}
                  </button>
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#1A2332] uppercase tracking-wider mb-1">
                  Confirm Password
                </label>
                <div className="relative rounded-[14px]">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#94A3B8]">
                    <IconLock size={14} />
                  </div>
                  <input
                    type={showConfirmPassword ? 'text' : 'password'}
                    required
                    value={confirmPassword}
                    onChange={(e) => setConfirmPassword(e.target.value)}
                    placeholder="Re-enter password"
                    className="w-full pl-9 pr-10 py-2.5 bg-white text-[#1A2332] text-xs rounded-[14px] border border-[#E2E8F0] placeholder-[#94A3B8] focus:outline-none focus:border-[#00AFEF] focus:ring-4 focus:ring-[#E6F6FE]"
                  />
                  <button
                    type="button"
                    onClick={() => setShowConfirmPassword(!showConfirmPassword)}
                    className="absolute inset-y-0 right-0 pr-3 flex items-center text-[#94A3B8]"
                  >
                    {showConfirmPassword ? <IconEyeOff size={14} /> : <IconEye size={14} />}
                  </button>
                </div>
              </div>

              <div className="pt-1">
                <label className="flex items-start space-x-2 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={acceptedTerms}
                    onChange={(e) => setAcceptedTerms(e.target.checked)}
                    className="mt-0.5 w-4 h-4 text-[#00AFEF] border-[#E2E8F0] rounded"
                  />
                  <span className="text-xs text-[#475569]">
                    I agree to the{' '}
                    <button
                      type="button"
                      onClick={onOpenTerms}
                      className="font-semibold text-[#0088CC] hover:underline"
                    >
                      Terms and Conditions
                    </button>
                  </span>
                </label>
              </div>

              <button
                type="submit"
                disabled={isLoading}
                className="w-full py-3 px-6 rounded-[14px] bg-[#00AFEF] hover:bg-[#0099D3] text-white text-xs font-semibold shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-[#B3E5FC] disabled:opacity-70 flex items-center justify-center space-x-2 transition-all cursor-pointer"
              >
                {isLoading ? (
                  <span>Creating Account...</span>
                ) : (
                  <>
                    <span>Create Account</span>
                    <IconArrowRight size={14} />
                  </>
                )}
              </button>
            </form>

            <div className="mt-4 pt-4 border-t border-[#E2E8F0] text-center">
              <p className="text-xs text-[#475569]">
                Already have an account?{' '}
                <button
                  type="button"
                  onClick={onNavigateLogin}
                  className="font-semibold text-[#0088CC] hover:underline"
                >
                  Log In
                </button>
              </p>
            </div>
          </div>
        );
      };

      // Main Container Component
      const App = () => {
        const [view, setView] = useState('login'); // 'login', 'signup', 'forgot', 'dashboard'
        const [user, setUser] = useState(null);
        const [showTerms, setShowTerms] = useState(false);

        const handleLoginSuccess = (email) => {
          setUser({ email, name: email.split('@')[0] });
          setView('dashboard');
        };

        const handleSignUpSuccess = (email, firstName, lastName) => {
          setUser({ email, name: `${firstName} ${lastName}` });
          setView('dashboard');
        };

        if (view === 'dashboard' && user) {
          return (
            <div className="min-h-screen bg-[#F0F4F8] text-[#1A2332] p-6 max-w-6xl mx-auto">
              <header className="flex items-center justify-between pb-6 border-b border-[#E2E8F0] mb-6">
                <div className="flex items-center space-x-3">
                  <LogoBadge size="sm" />
                  <div>
                    <h1 className="text-xl font-bold font-garamond text-[#1A2332]">Apex Accounting Workspace</h1>
                    <p className="text-xs text-[#475569]">Session Active • {user.email}</p>
                  </div>
                </div>
                <button
                  onClick={() => { setUser(null); setView('login'); }}
                  className="px-4 py-2 rounded-[10px] bg-rose-50 text-rose-700 text-xs font-semibold border border-rose-200 hover:bg-rose-100"
                >
                  Sign Out
                </button>
              </header>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div className="bg-white p-5 rounded-[14px] border border-[#E2E8F0] shadow-auth-subtle">
                  <div className="text-xs text-[#475569] uppercase font-semibold">Total Assets</div>
                  <div className="text-2xl font-bold text-[#1A2332] mt-1">$14,850,290.00</div>
                  <div className="text-xs text-emerald-600 font-semibold mt-2">↑ +12.4% vs last month</div>
                </div>
                <div className="bg-white p-5 rounded-[14px] border border-[#E2E8F0] shadow-auth-subtle">
                  <div className="text-xs text-[#475569] uppercase font-semibold">Accounts Receivable</div>
                  <div className="text-2xl font-bold text-[#1A2332] mt-1">$1,420,900.00</div>
                  <div className="text-xs text-emerald-600 font-semibold mt-2">98.2% Reconciled</div>
                </div>
                <div className="bg-white p-5 rounded-[14px] border border-[#E2E8F0] shadow-auth-subtle">
                  <div className="text-xs text-[#475569] uppercase font-semibold">Audit Status</div>
                  <div className="text-2xl font-bold text-[#0088CC] mt-1">SOC-2 Verified</div>
                  <div className="text-xs text-[#475569] mt-2">Zero Discrepancies</div>
                </div>
              </div>

              <div className="bg-white p-6 rounded-[14px] border border-[#E2E8F0] shadow-auth-subtle">
                <h3 className="text-sm font-bold text-[#1A2332] mb-3">Recent Financial Log</h3>
                <div className="space-y-2 text-xs">
                  <div className="p-3 bg-[#F8FAFC] rounded-[10px] border border-[#E2E8F0] flex justify-between">
                    <span>Wire Deposit #INV-2026-894 (Microsoft Corp)</span>
                    <span className="font-bold text-emerald-600">+$245,000.00</span>
                  </div>
                  <div className="p-3 bg-[#F8FAFC] rounded-[10px] border border-[#E2E8F0] flex justify-between">
                    <span>Direct Deposit Clearing Payroll #PAY-4412</span>
                    <span className="font-bold text-[#1A2332]">-$82,400.00</span>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen w-full bg-[#F0F4F8] text-[#1A2332] flex flex-col">
            <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-10 flex items-center">
              <div className="w-full grid grid-cols-1 lg:grid-cols-[1.15fr_0.85fr] gap-6 lg:gap-8 items-stretch">
                <LandingPage />
                <div className="w-full bg-white rounded-[22px] border border-[#E2E8F0] shadow-auth-card p-6 sm:p-10 lg:p-12 flex items-center">
                  <div className="w-full flex flex-col justify-center">
                    {view === 'login' && (
                      <LoginForm onNavigateSignUp={() => setView('signup')} onNavigateForgot={() => setView('forgot')} onLoginSuccess={handleLoginSuccess} />
                    )}
                    {view === 'signup' && (
                      <SignUpForm onNavigateLogin={() => setView('login')} onOpenTerms={() => setShowTerms(true)} onSignUpSuccess={handleSignUpSuccess} />
                    )}
                    {view === 'forgot' && (
                      <div className="w-full max-w-md mx-auto text-center space-y-4">
                        <button onClick={() => setView('login')} className="inline-flex items-center space-x-1.5 text-xs text-[#475569] bg-[#F8FAFC] px-3 py-1.5 rounded-full border border-[#E2E8F0]">
                          <IconArrowLeft size={14} /><span>Return to Sign In</span>
                        </button>
                        <h2 className="text-2xl font-garamond text-[#1A2332]">Password Reset Requested</h2>
                        <p className="text-xs text-[#475569]">Instructions will be dispatched to your corporate email.</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </main>
            <footer className="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-5 text-center text-xs text-[#94A3B8]">
              © 2026 ProntoLog. ISP Accounting & Financial Operations Platform.
            </footer>

            {showTerms && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-[14px] p-6 max-w-md w-full border border-[#E2E8F0] shadow-auth-card space-y-4">
                  <h3 className="text-base font-bold text-[#1A2332]">Enterprise Terms of Service</h3>
                  <p className="text-xs text-[#475569] leading-relaxed">
                    Access to this accounting portal requires adherence to standard general ledger reconciliations and corporate data protection rules.
                  </p>
                  <button
                    onClick={() => setShowTerms(false)}
                    className="w-full py-2.5 bg-[#00AFEF] text-white text-xs font-semibold rounded-[10px]"
                  >
                    Close & Accept
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
